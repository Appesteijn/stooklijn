title: Quatt Warmteanalyse
views:
  # ─── VIEW 1: OVERZICHT ───────────────────────────────────────────────
  # Beantwoordt: "Hoe doet mijn warmtepomp het?"
  # Desktop: 2 kolommen | Mobiel: 1 kolom, alles gestapeld
  - title: Overzicht
    icon: mdi:home-thermometer
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Linkerkolom: COP & status ──
      - type: grid
        cards:
          - type: gauge
            entity: sensor.quatt_warmteanalyse_geschatte_actuele_cop
            name: COP nu
            min: 0
            max: 6
            severity:
              green: 3
              yellow: 2
              red: 0
            needle: true
            grid_options:
              columns: full
              rows: 3
          - type: tile
            entity: sensor.quatt_warmteanalyse_average_cop
            name: Gemiddelde COP
            icon: mdi:gauge
            color: green
          - type: tile
            entity: sensor.quatt_warmteanalyse_analysis_status
            name: Status
            icon: mdi:information-outline
          - type: button
            name: Analyse starten
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: quatt_stooklijn.run_analysis
            show_name: true
            show_icon: true
            icon_height: 28px
            grid_options:
              columns: full
              rows: 1

      # ── Rechterkolom: kengetallen ──
      - type: grid
        cards:
          - type: tile
            entity: sensor.quatt_warmteanalyse_heat_loss_coefficient
            name: Warmteverlies (W/K)
            icon: mdi:home-thermometer
            color: orange
          - type: tile
            entity: sensor.quatt_warmteanalyse_balance_point_temperature
            name: Balanspunt
            icon: mdi:thermometer-check
            color: cyan
          - type: tile
            entity: sensor.quatt_warmteanalyse_knee_temperature
            name: Knikpunt
            icon: mdi:chart-line-variant
            color: amber
          # Toont de echte Quatt-setpoint als die bestaat. Die sensor komt uit
          # de Quatt-integratie en wordt alleen aangemaakt bij een thermostaat
          # op de OpenTherm-ingang — niet op elk systeem. Ontbreekt hij, dan
          # valt de tile hieronder terug op het stooklijn-advies van deze
          # integratie (altijd beschikbaar). Een niet-bestaande entity wordt
          # door HA als 'unavailable' behandeld, dus de visibility-conditie klopt.
          - type: tile
            entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
            name: Quatt Setpoint
            icon: mdi:thermometer-chevron-up
            color: red
            visibility:
              - condition: state
                entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
            name: Stooklijn setpoint
            icon: mdi:thermometer-chevron-up
            color: red
            visibility:
              - condition: state
                entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
                state:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.quatt_warmteanalyse_last_analysis
            name: Laatste analyse
            icon: mdi:clock-check-outline
          - type: tile
            entity: text.quatt_warmteanalyse_analyse_startdatum
            name: Startdatum
            icon: mdi:calendar-start

      # ── Comfort chart (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:mini-graph-card
            name: Comfort & Temperaturen (7 dagen)
            hours_to_show: 168
            points_per_hour: 2
            line_width: 2
            show:
              labels: true
              points: false
            entities:
              - entity: sensor.quatt_warmteanalyse_kamertemperatuur
                name: Kamer
                color: "#E53935"
              - entity: sensor.quatt_warmteanalyse_kamer_setpoint
                name: Setpoint
                color: "#FF8A80"
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buiten
                color: "#78909C"
            grid_options:
              columns: full
              rows: auto

      # ── Snel advies (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Quatt advies
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit om advies te zien.*

              {% else %}

              {% set n =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'aantal_aanpassingen') | int(0) %}

              {% if n == 0 %}

              ✅ **Alle Quatt-instellingen zijn optimaal.**

              {% else %}

              ⚠️ **{{ advies }}**


              {% set sg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_advies') %}

              {% set vg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_advies') %}

              {% if sg and 'goed' not in sg %}• {{ sg }}{% endif %}

              {% if vg and 'goed' not in vg %}• {{ vg }}{% endif %}


              *Ga naar het **Advies** tabblad voor alle details en
              stooklijnpunten.*

              {% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 2: ANALYSE ─────────────────────────────────────────────────
  # Beantwoordt: "Wat zijn de details van mijn warmteprestaties?"
  - title: Analyse
    icon: mdi:chart-scatter-plot-hexbin
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Thermisch profiel (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Huis thermisch profiel
              show: true
            update_interval: "00:30:00"
            apex_config:
              chart:
                height: 350
              xaxis:
                min: EVAL:Date.now() - 36 * 3600000
                max: EVAL:Date.now()
                title:
                  text: Buitentemperatuur (°C)
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              yaxis:
                title:
                  text: Vermogen (W)
                min: 0
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(val) + ' W'; }
              tooltip:
                x:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              markers:
                size:
                  - 4
                  - 0
                  - 0
                  - 0
                  - 0
                  - 4
                  - 0
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_optimal_stooklijn_slope
                name: Dagelijkse warmtevraag
                color: "#66BB6A"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_optimal_stooklijn_slope']?.attributes
                  || {};

                  const balanceTemp = Math.min(attrs.balance_temp ?? 20, 20);

                  const now = Date.now(), d = (attrs.scatter_data ||
                  []).filter(p => p.heat > 0 && p.temp < Math.min(balanceTemp,
                  19));

                  return d.map(p => [now - (20 - p.temp) * 3600000, p.heat]);
              - entity: sensor.quatt_warmteanalyse_optimal_stooklijn_slope
                name: Optimale stooklijn
                color: "#4CAF50"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const st =
                  hass.states['sensor.quatt_warmteanalyse_optimal_stooklijn_slope'];

                  const s = parseFloat(st?.state), ic =
                  st?.attributes?.intercept;

                  if (isNaN(s) || ic == null) return [];

                  const now = Date.now(), pts = [], maxT = s !== 0 ?
                  Math.min(-ic/s, 19) : 19;

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
              - entity: sensor.quatt_warmteanalyse_quatt_warmteanalyse_slope
                name: Quatt stooklijn (geschat)
                color: "#FFC107"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_quatt_warmteanalyse_slope']?.attributes
                  || {};

                  const s = attrs.slope_daily, ic = attrs.intercept_daily;

                  if (!s || ic == null) return [];

                  const now = Date.now(), pts = [], maxT = s !== 0 ?
                  Math.min(-ic/s, 19) : 19;

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
              - entity: sensor.quatt_warmteanalyse_freezing_performance_slope
                name: HP capaciteit (vorst)
                color: "#1E88E5"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const st =
                  hass.states['sensor.quatt_warmteanalyse_freezing_performance_slope'];

                  const s = parseFloat(st?.state), ic =
                  st?.attributes?.intercept;

                  const maxT = st?.attributes?.knee_temperature ?? 2;

                  if (isNaN(s) || ic == null) return [];

                  const now = Date.now(), pts = [];

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
              - entity: sensor.quatt_warmteanalyse_gas_heat_loss_coefficient
                name: Gas data
                color: "#FFB74D"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_gas_heat_loss_coefficient']?.attributes
                  || {};

                  const balanceTemp = attrs.balance_point ?? 20;

                  const now = Date.now(), d = (attrs.scatter_data ||
                  []).filter(p => p.heat > 0 && p.temp < balanceTemp);

                  return d.map(p => [now - (20 - p.temp) * 3600000, p.heat]);
              - entity: sensor.quatt_warmteanalyse_gas_heat_loss_coefficient
                name: Gas trendlijn
                color: "#FF9800"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_gas_heat_loss_coefficient']?.attributes
                  || {};

                  const s = attrs.slope, ic = attrs.intercept;

                  if (!s || ic == null) return [];

                  const now = Date.now(), pts = [], maxT = s !== 0 ?
                  Math.min(-ic/s, 19) : 19;

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
            grid_options:
              columns: full
              rows: auto

      # ── COP chart (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: COP vs Buitentemperatuur
              show: true
            update_interval: "00:30:00"
            apex_config:
              chart:
                height: 300
              xaxis:
                min: EVAL:Date.now() - 36 * 3600000
                max: EVAL:Date.now()
                title:
                  text: Buitentemperatuur (°C)
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              yaxis:
                title:
                  text: COP
                min: 0
              tooltip:
                x:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              markers:
                size:
                  - 4
                  - 0
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_average_cop
                name: Dagelijkse COP
                color: "#42A5F5"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_average_cop']?.attributes
                  || {};

                  const now = Date.now(), d = [...(attrs.cop_scatter_data ||
                  [])].filter(p => p.cop > 0 && p.temp < 20).sort((a, b) =>
                  a.temp - b.temp);

                  return d.map(p => [now - (20 - p.temp) * 3600000, p.cop]);
              - entity: sensor.quatt_warmteanalyse_average_cop
                name: COP trendlijn
                color: "#1565C0"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_average_cop']?.attributes
                  || {};

                  const d = [...(attrs.cop_scatter_data || [])].filter(p =>
                  p.cop > 0 && p.temp < 20).sort((a, b) => a.temp - b.temp);

                  if (d.length < 2) return [];

                  const n = d.length, sumX = d.reduce((s,p) => s+p.temp, 0),
                  sumY = d.reduce((s,p) => s+p.cop, 0), sumXY = d.reduce((s,p)
                  => s+p.temp*p.cop, 0), sumX2 = d.reduce((s,p) =>
                  s+p.temp*p.temp, 0);

                  const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);

                  const intercept = (sumY - slope*sumX) / n;

                  const now = Date.now(), pts = [], minT = d[0].temp, maxT =
                  d[d.length-1].temp;

                  for (let t = minT; t <= maxT; t += 0.5) pts.push([now - (20 -
                  t) * 3600000, slope*t + intercept]);

                  pts.push([now - (20 - maxT) * 3600000, null]);

                  return pts;
            grid_options:
              columns: full
              rows: auto

      # ── Warmtevraag tabel ──
      - type: grid
        cards:
          - type: markdown
            title: Warmtevraag per temperatuur
            content: >
              {% set temps =
              state_attr('sensor.quatt_warmteanalyse_heat_loss_coefficient',
              'heat_at_temps') %}

              {% if temps %}

              Buiten | Vermogen | Warmte/dag | COP | Stroom/dag

              :--|--:|--:|--:|--:

              {% for t, data in temps.items() -%}

              **{{ t }}°C** | **{{ data.heat | round(0) | int }} W** | {{
              (data.heat * 24 / 1000) | round(1) }} kWh | {% if data.cop %}{{
              data.cop | round(2) }}{% else %}-{% endif %} | {% if data.cop and
              data.cop > 0 %}{{ ((data.heat * 24 / 1000) / data.cop) | round(1)
              }} kWh{% else %}-{% endif %}

              {% endfor %}

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Data & uitleg ──
      - type: grid
        cards:
          - type: markdown
            title: Databeschikbaarheid
            content: >
              {% set s =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'daily_days') %}

              {% if s is not none %}

              {% set daily =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'daily_days') | int(0) %}

              {% set hourly =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'hourly_hours') | int(0) %}

              {% set minutes =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'minute_minutes') | int(0) %}

              {% set c_days =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'cache_days') | int(0) %}

              {% set c_old =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'cache_oldest') %}

              {% set c_new =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'cache_newest') %}

              {% set k_pts =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'knee_store_points') | int(0) %}

              {% set k_old =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'knee_store_oldest') %}

              {% set k_new =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'knee_store_newest') %}

              | Dataset | Omvang |

              |:--------|-------:|

              | Daggemiddeldes | **{{ daily }} dagen** |

              | Uurwaarden | **{{ hourly }} uur** |

              | Minuutwaarden | **{{ minutes }} min** |

              | Knie-datastore | **{{ k_pts }} ptn**{% if k_old %} ({{
              k_old[:7] }} – {{ k_new[:7] }}){% endif %} |

              | API-cache | **{{ c_days }} dagen**{% if c_old %} ({{
              c_old[:7] }} – {{ c_new[:7] }}){% endif %} |

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: markdown
            title: Wat betekenen de waarden?
            content: >
              {% set hlc =
              states('sensor.quatt_warmteanalyse_heat_loss_coefficient') %}

              {% set bp =
              states('sensor.quatt_warmteanalyse_balance_point_temperature') %}

              {% set knee =
              states('sensor.quatt_warmteanalyse_knee_temperature') %}

              {% set cop = states('sensor.quatt_warmteanalyse_average_cop') %}

              {% if hlc not in ['unknown', 'unavailable', 'None'] %}

              **Warmteverlies ({{ hlc }} W/K)** — Per graad kouder verliest
              je huis {{ hlc }} W. Lager = beter geïsoleerd.


              **Balanspunt ({{ bp }}°C)** — Boven deze buitentemp is geen
              verwarming nodig.


              **Knikpunt ({{ knee }}°C)** — Onder deze temp moet de
              cv-ketel bijspringen.


              **COP ({{ cop }})** — Elke kWh stroom levert {{ cop }} kWh
              warmte.

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 3: ADVIES ──────────────────────────────────────────────────
  # Beantwoordt: "Wat moet ik bij Quatt laten aanpassen?"
  - title: Advies
    icon: mdi:lightbulb-on-outline
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Samenvatting (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: tile
            entity: sensor.quatt_warmteanalyse_quatt_advies_parameters
            name: Advies status
            icon: mdi:tune
            color: amber
          - type: tile
            entity: sensor.quatt_warmteanalyse_balance_point_temperature
            name: Balanspunt (optimaal)
            icon: mdi:thermometer-check
            color: cyan
          - type: tile
            entity: sensor.quatt_warmteanalyse_openquatt_balance_point
            name: OpenQuatt Balanspunt
            icon: mdi:home-thermometer-outline
            color: teal
          - type: markdown
            title: Advies samenvatting
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              {% set sg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_advies') %}

              {% set vg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_advies') %}

              {% set sl =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stooklijn_advies') %}

              {% set n =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'aantal_aanpassingen') | int(0) %}

              {% if n == 0 %}

              ✅ Alle instellingen zijn optimaal.

              {% else %}

              Geef de volgende aanpassingen door aan Quatt:


              {% if sg and 'goed' not in sg %}1. **Stookgrens:** {{ sg }}{%
              endif %}

              {% if vg and 'goed' not in vg %}2. **Vermogen:** {{ vg }}{%
              endif %}

              {% if sl %}3. **Stooklijn:** {{ sl }}{% endif %}

              {% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Stookgrens detail ──
      - type: grid
        cards:
          - type: markdown
            title: Stookgrens
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              {% set cur =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_huidig') %}

              {% set opt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_optimaal') %}

              {% set txt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_advies') %}

              | | Waarde |

              |:--|--:|

              | Quatt stooklijn (daggemiddeld) | {% if cur %}**{{ cur }}°C**{% else
              %}*onbekend*{% endif %} |

              | Huis optimaal (lineair) | {% if opt %}**{{ opt }}°C**{% else %}*onbekend*{%
              endif %} |


              {% if txt %}{{ txt }}{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Nominaal vermogen detail ──
      - type: grid
        cards:
          - type: markdown
            title: Nominaal vermogen (bij -10°C)
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              {% set cur =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_huidig_w') %}

              {% set opt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_optimaal_w') %}

              {% set txt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_advies') %}

              {% set betrouwbaar =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_betrouwbaar') %}

              | | Waarde |

              |:--|--:|

              | Huidig (Quatt) | {% if cur %}{{ '~~' if not betrouwbaar }}**{{ cur
              }} W**{{ '~~' if not betrouwbaar }}{% else %}*niet
              geconfigureerd*{% endif %} |

              | Optimaal | {% if opt %}**{{ opt }} W**{% else %}*onbekend*{%
              endif %} |


              {% if txt %}{{ txt }}{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Stooklijn breakpoints + chart (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Optimale stooklijn breakpoints
            content: >
              {% set punten =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stooklijn_punten') %}

              {% if punten %}

              {% set txt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stooklijn_advies') %}

              Geef deze punten door aan Quatt:


              Buitentemp | Aanvoertemp

              :--|--:

              {% for bp in punten -%}

              **{{ bp.buiten_temp }}°C** | **{{ bp.aanvoer_temp }}°C**

              {% endfor %}


              {% if txt %}*{{ txt }}*{% endif %}

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: custom:apexcharts-card
            header:
              title: Stooklijn — Optimaal vs Huidig
              show: true
            update_interval: "00:30:00"
            apex_config:
              chart:
                height: 300
              xaxis:
                min: EVAL:Date.now() - 30 * 3600000
                max: EVAL:Date.now()
                title:
                  text: Buitentemperatuur (°C)
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              yaxis:
                title:
                  text: Aanvoertemperatuur (°C)
                min: 20
                max: 55
              tooltip:
                x:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              markers:
                size:
                  - 5
                  - 0
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_openquatt_stooklijn
                name: Optimale breakpoints
                color: "#4CAF50"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_openquatt_stooklijn']?.attributes
                  || {};

                  const bps = attrs.breakpoints || [];

                  if (!bps.length) return [];

                  const now = Date.now();

                  return bps.map(bp => [now - (20 - bp.buiten_temp) * 3600000,
                  bp.aanvoer_temp]);
              - entity: sensor.quatt_warmteanalyse_openquatt_stooklijn
                name: Optimale curve
                color: "#4CAF50"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_openquatt_stooklijn']?.attributes
                  || {};

                  const bps = attrs.breakpoints || [];

                  if (!bps.length) return [];

                  const now = Date.now();

                  return bps.map(bp => [now - (20 - bp.buiten_temp) * 3600000,
                  bp.aanvoer_temp]);
            grid_options:
              columns: 12
              rows: auto

      # ── OpenQuatt info (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: OpenQuatt integratie
            content: >
              {% set bp =
              states('sensor.quatt_warmteanalyse_openquatt_balance_point') %}

              {% set curve =
              states('sensor.quatt_warmteanalyse_openquatt_stooklijn') %}

              {% if bp in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              Sensoren beschikbaar voor OpenQuatt automations:


              | Sensor | Waarde |

              |:--|--:|

              | Balanspunt | **{{ bp }}°C** |

              | Stooklijn breakpoints | **{{ curve }} punten** |

              | MPC aanvoertemp | **{{
              states('sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur')
              }}°C** |


              {% set kal = 'sensor.quatt_warmteanalyse_openquatt_power_house_kalibratie' %}

              {% set a = state_attr(kal, 'zero_power_temp') %}

              {% if a is not none %}

              **Power House huismodel** — {{ states(kal) }}

              | Parameter | Nu | Advies |

              |:--|--:|--:|

              | House cold temp | {{ state_attr(kal, 'cold_temp_huidig') }}°C |
              **{{ state_attr(kal, 'cold_temp') }}°C** |

              | Rated max house power | {{ state_attr(kal, 'rated_power_huidig')
              }} W | **{{ state_attr(kal, 'rated_power') }} W** |

              {% if state_attr(kal, 'zero_power_temp_geadviseerd') %}

              | Stookgrens | {{ state_attr(kal, 'zero_power_temp_huidig') }}°C |
              **{{ a }}°C** |


              De ingestelde stookgrens staat **{{ state_attr(kal,
              'stookgrens_afwijking_w') | abs }} W** van de meting af: zo veel
              vraagt de feedforward elke stookdag {% if state_attr(kal,
              'stookgrens_afwijking_w') > 0 %}te weinig{% else %}te veel{% endif
              %}. Pas de drie waarden samen aan — Tc en Pr hierboven horen bij
              het nieuwe nulpunt.

              {% else %}

              Stookgrens staat op **{{ a }}°C** en wordt overgenomen, niet
              geadviseerd: hij ligt binnen één knopstap van de meting ({{
              state_attr(kal, 'balanspunt_gemeten') }}°C, afwijking {{
              state_attr(kal, 'stookgrens_afwijking_w') }} W), en daaronder valt
              er niets te corrigeren.

              {% endif %}


              *{{ state_attr(kal, 'toelichting') }}* (bron: {{ state_attr(kal,
              'capaciteitsbron') }})

              {% endif %}


              {% set wv = 'sensor.quatt_warmteanalyse_warmtevraag' %}

              {% set vraag = states(wv) %}

              {% if vraag not in ['unknown', 'unavailable', 'None'] %}

              **Warmtevraag** — {{ vraag }} W bij {{ state_attr(wv,
              'buiten_temp') }}°C buiten, gerekend vanaf een nulpunt van {{
              state_attr(wv, 'nulpunt') }}°C ({{ state_attr(wv, 'nulpunt_bron')
              }}).

              {% if state_attr(wv, 'koppeling_actief') %}

              Deze waarde stuurt Power House rechtstreeks aan: ze vervangt de
              feedforward, terwijl de comfortterm, de clamp op Pr en de
              waterbegrenzer van de firmware blijven.{% if state_attr(wv,
              'firmware_bevestigt') %} De firmware bevestigt dat zelf met
              *demand source = external*.{% endif %}

              {% if state_attr(wv, 'boven_firmware_plafond') %}

              ⚠️ De vraag ligt boven **Rated maximum house power** ({{
              state_attr(wv, 'firmware_plafond_w') }} W); de firmware kapt hem
              daar stilletjes af. Stel Pr bij via het huismodel hierboven.

              {% endif %}

              {% elif state_attr(wv, 'koppeling_ingesteld') %}

              ⚠️ **De koppeling staat goed ingesteld, maar de firmware gebruikt
              hem niet.** *Power House – demand source* meldt `{{
              state_attr(wv, 'firmware_feedforward') }}`, dus de installatie
              draait op haar eigen huismodel en verwerpt de gepubliceerde
              waarde. Controleer of de proxy een geldig getal doorgeeft.

              {% elif state_attr(wv, 'keuzeknop_entity') %}

              Niet gekoppeld — {{ state_attr(wv, 'koppeling') }}. Zet
              `{{ state_attr(wv, 'bronhelper') }}` op `{{ wv }}` en de
              OpenQuatt-keuzeknop *External Heat Demand Source* op **HA input**.
              Leegmaken van die bronhelper zet de installatie terug op haar
              eigen huismodel.

              {% endif %}

              {% endif %}


              Maak een HA-automation die deze waarden naar je OpenQuatt
              entiteiten schrijft.

              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 4: MPC VALIDATIE ───────────────────────────────────────────
  # Beantwoordt: "Is het MPC-advies beter dan de vaste stooklijn?"
  - title: MPC
    icon: mdi:brain
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Status tegels (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: tile
            entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
            name: Stooklijn advies
            icon: mdi:thermometer-water
            color: blue
          - type: tile
            entity: sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur
            name: MPC advies
            icon: mdi:brain
            color: green
          - type: tile
            entity: sensor.quatt_warmteanalyse_stooklijn_fout_aanvoertemperatuur
            name: Stooklijn fout
            icon: mdi:thermometer-alert
            color: blue
          - type: tile
            entity: sensor.quatt_warmteanalyse_mpc_fout_aanvoertemperatuur
            name: MPC fout
            icon: mdi:thermometer-alert
            color: green
          - type: tile
            entity: sensor.quatt_warmteanalyse_veilige_uitlooptijd
            name: Veilige uitlooptijd
            icon: mdi:home-clock-outline
            color: orange

      # ── Thermisch model (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Thermisch model (online learning)
            content: >
              {% set mpc =
              'sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur' %}

              {% set src = state_attr(mpc, 'model_source') %}

              {% if src %}

              {% set conv = state_attr(mpc, 'model_converged') %}

              {% set n = state_attr(mpc, 'model_n_updates') | int(0) %}

              {% set U = state_attr(mpc, 'model_U_wk') %}

              {% set C = state_attr(mpc, 'model_C_whk') %}

              {% set g = state_attr(mpc, 'model_g_solar') %}

              {% set tau = state_attr(mpc, 'model_tau_hours') %}

              {% if conv %}

              | Parameter | Waarde | Betekenis |

              |:--|--:|:--|

              | Warmteverlies | **{{ U }} W/K** | Per °C kouder verliest
              je huis {{ U }} W |

              | Thermische massa | **{{ C }} Wh/K** | Hoe traag reageert
              je huis op veranderingen |

              | Tijdconstante | **{{ tau }} uur** | Tijd om 63% af te
              koelen zonder verwarming |

              | Zonnewinst | **{{ g }} W/(W/m²)** | Effectief
              raamoppervlak × glastransmissie |

              | Updates | **{{ n }}** ({{ (n / 24) | round(0) | int }}
              dagen) | |


              Bron: **{{ src }}** — het model leert elk uur bij.

              {% elif n < 48 %}

              Model is aan het leren... **{{ n }}/48 updates** (nog {{
              48 - n }} uur).


              Gebruikt nu het batch warmteverliesmodel als fallback.

              {% else %}

              Model heeft genoeg data (**{{ n }} updates**), maar de
              geleerde parameters zijn nog buiten fysisch bereik:

              | Parameter | Huidig | Verwacht |

              |:--|--:|--:|

              | Warmteverlies | {{ U }} W/K | 30–800 W/K |

              | Thermische massa | {{ C }} Wh/K | 500–30000 Wh/K |

              | Zonnewinst | {{ g }} W/(W/m²) | 0–20 |


              Wacht op meer koude uren waarbij de warmtepomp actief is —
              dan leert het model betrouwbare waarden.

              {% endif %}

              {% else %}

              *Model nog niet geladen. Start een analyse of wacht op het
              volgende uur.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Veilige uitlooptijd / comfort-vloer (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Veilige uitlooptijd (Energy OS comfort-guard)
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_veilige_uitlooptijd' %}

              {% set coast = states(s) %}

              {% if coast not in ['unknown', 'unavailable', 'none'] %}

              {% set mins = coast | int(0) %}

              {% set floor = state_attr(s, 'comfort_floor') %}

              {% set at_risk = state_attr(s, 'comfort_at_risk') %}

              {% set reaches = state_attr(s, 'reaches_floor') %}

              ### 🏠⏱️ {{ (mins / 60) | round(1) }} uur  _( {{ mins }} min )_


              Zo lang kan het huis met de **warmtepomp uit** uitlopen op zijn
              thermische massa vóór de binnentemperatuur de comfort-vloer van
              **{{ floor }}°C** raakt. De Open-Meteo zon-forecast telt mee —
              meer voorspelde zon ⇒ langere uitlooptijd.


              {% if not reaches %}☀️ **Komt binnen 12 uur niet onder de
              comfort-vloer** — ruim voldoende warmte/zon op voorraad.

              {% elif at_risk %}⚠️ Bereikt de comfort-vloer binnen het
              simulatievenster — knijp de WP niet te lang.

              {% endif %}


              Energy OS knijpt bij een duur tarief de warmtepomp alléén zolang
              deze tijd boven de marge ligt
              (`input_number.eos_comfort_coast_margin_min`); daaronder krijgt
              comfort voorrang en draait de WP weer vrij.

              {% else %}

              *Nog niet beschikbaar — het RC-model is nog niet geconvergeerd, of
              de sensor bestaat nog niet na een herstart/update. Energy OS valt
              zolang terug op de buitentemp-heuristiek (alsof zonder
              stooklijn).*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── 6-uurs forecast (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: 6-uurs forecast
            content: >
              {% set mpc =
              'sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur' %}

              {% set fc = state_attr(mpc, 'forecast_6h') %}

              {% set src = state_attr(mpc, 'model_source') %}

              {% if fc and fc | length > 0 %}

              {% set ns = namespace(tbl='| Uur | T buiten | T binnen | HP | Vermogen | Aanvoer | Aanvoer (geen zon) |\n|:--|--:|--:|:--:|--:|--:|--:|\n') %}{% for h in fc %}{% set t_in = h.get('t_indoor_predicted') %}{% set ns_val = h.get('supply_temp_no_solar') %}{% set ns.tbl = ns.tbl + '| **+' + h.hour|string + '** | ' + h.temp_forecast|string + '°C | ' + (t_in|string + '°C' if t_in is not none else '-') + ' | ' + ('🔥' if h.get('hp_needed') else '⏸️') + ' | ' + (h.get('q_hp_needed_w')|string + ' W' if h.get('q_hp_needed_w') is not none else '-') + ' | ' + (h.supply_temp|string + '°C' if h.supply_temp is not none else '-') + ' | ' + (ns_val|string + '°C' if ns_val is not none else '-') + ' |\n' %}{% endfor %}

              {{ ns.tbl }}

              *Bron: {{ src | default('batch') }}*

              {% else %}

              *Geen forecast beschikbaar. Wacht op weersverwachting.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Rendement & herverdeling (validatie richting 1.0) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Rendement & herverdeling
            content: >
              {% set cp = 'sensor.quatt_warmteanalyse_cop_prestatie' %}

              {% set ratio = states(cp) | float(none) %}

              {% if ratio is not none %}

              {% set d7 = state_attr(cp, 'rolling_7d') %}

              {% set dag = state_attr(cp, 'laatste_ratio') %}

              ### {{ ratio }} — rendement t.o.v. de eigen norm

              1,00 is zoals deze installatie het bij die buitentemperatuur altijd deed.
              Hoger is beter. Dit is het 30-daags gemiddelde; losse dagen schommelen
              ongeveer 12%.

              | | Waarde |

              |:--|--:|

              | 30 dagen | **{{ ratio }}** |

              | 7 dagen | {{ d7 }} |

              | Laatste stookdag ({{ state_attr(cp, 'laatste_dag') }}) | {{ dag }} |

              | Norm gebouwd uit | {{ state_attr(cp, 'referentie_stookdagen') }} stookdagen |

              {% else %}

              *Nog geen rendementsmaat — er zijn stookdagen nodig om een norm te bouwen.*

              {% endif %}

              {% set ws = 'sensor.quatt_warmteanalyse_warmtevraag_verschoven' %}

              {% set nu = states(ws) | float(none) %}

              {% if nu is not none %}

              {% set g = state_attr(ws, 'gamma') | float(0) %}

              {% set bes = state_attr(ws, 'verwachte_besparing') | float(0) %}

              ### Herverdeling — γ = {{ g }}{% if g == 0 %} (uit){% endif %}

              {% if g == 0 %}

              Staat uit: de verschoven vraag is gelijk aan de gewone. Zet γ hoger in de
              integratie-opties om te zien wat verschuiven zou opleveren. Er wordt niets
              mee aangestuurd.

              {% else %}

              Zou nu **{{ nu | round(0) }} W** publiceren in plaats van
              **{{ state_attr(ws, 'vlak_nu') | round(0) }} W**.

              {% endif %}

              | | Waarde |

              |:--|--:|

              | Verwachte besparing | **{{ (bes * 100) | round(2) }}%** |

              | Venster | {{ state_attr(ws, 'venster_uren') }} uur |

              | Voorspelde kamerdrift | {{ state_attr(ws, 'voorspelde_drift_k') }} K |

              | Uren boven firmwareplafond | {{ state_attr(ws, 'uren_boven_plafond') }} |

              {% if (state_attr(ws, 'drift_begrenzing') | float(1)) < 1 %}

              > De comfortgrens greep in: de verschuiving is teruggeschaald met factor
              {{ state_attr(ws, 'drift_begrenzing') }} om de kamerdrift onder 0,3 K te houden.

              {% endif %}

              {% if (state_attr(ws, 'uren_boven_plafond') | int(0)) > 0 %}

              > In {{ state_attr(ws, 'uren_boven_plafond') }} uur komt de verdeling boven
              *Rated maximum house power*. Daar kapt de firmware af en gaat de
              energie-neutraliteit alsnog verloren — kies dan een lagere γ.

              {% endif %}

              *Schaduwsensor: nergens aan gekoppeld.*

              {% else %}

              *Herverdeling nog niet beschikbaar — wacht op de weersverwachting en een
              geconvergeerd thermisch model.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Aanvoertemperatuur vergelijking (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:mini-graph-card
            name: Aanvoertemperatuur — Advies vs Werkelijk (24 uur)
            hours_to_show: 24
            points_per_hour: 4
            line_width: 1.5
            show:
              labels: true
              points: false
            entities:
              - entity: sensor.quatt_warmteanalyse_aanvoertemperatuur
                name: Werkelijk
                color: "#90A4AE"
              - entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                name: Stooklijn advies
                color: "#2196F3"
              - entity: sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur
                name: MPC advies
                color: "#4CAF50"
            grid_options:
              columns: full
              rows: auto

      # ── Foutmeting (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Fout — Advies minus Werkelijk (24 uur)
              show: true
            graph_span: 24h
            apex_config:
              chart:
                height: 200
              yaxis:
                min: -10
                max: 10
                tickAmount: 4
              stroke:
                width: [2, 2]
                curve: smooth
                dashArray: [0, 4]
              annotations:
                yaxis:
                  - y: 0
                    borderColor: "#999"
                    strokeDashArray: 4
                    borderWidth: 1
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_stooklijn_fout_aanvoertemperatuur
                name: Stooklijn fout
                color: "#2196F3"
                stroke_width: 2
              - entity: sensor.quatt_warmteanalyse_mpc_fout_aanvoertemperatuur
                name: MPC fout
                color: "#FF9800"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Buitentemperatuur context ──
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Buitentemperatuur (7 dagen)
            hours_to_show: 168
            points_per_hour: 1
            line_width: 1
            show:
              labels: true
              points: false
            entities:
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buitentemp
                color: "#78909C"
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 5: SYSTEEM ────────────────────────────────────────────────
  # Beantwoordt: "Waar komen mijn metingen vandaan en hoe stookt het systeem?"
  #
  # Geluidsniveaucompensatie (sound_level_enabled) en aanvoerbegrenzing
  # (ch_max_water_enabled) zijn opt-in: staan ze uit, dan bestaan hun
  # entiteiten niet en tonen hun kaarten alleen foutmeldingen. De secties
  # hangen daarom aan een visibility-conditie. HA behandelt een niet-
  # bestaande entity als 'unavailable', dus de sectie verdwijnt vanzelf —
  # dezelfde truc als bij de Quatt-setpoint tile in de Overzicht-view.
  - title: Systeem
    icon: mdi:tune-variant
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Aanvoertemperatuur begrenzing — effect (48 uur) ──
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling
            state_not:
              - unavailable
              - unknown
        cards:
          - type: custom:apexcharts-card
            header:
              title: Aanvoertemp. begrenzing — limiet vs thermostaat (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: temp
                min: 15
                max: 60
                decimals: 0
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 300
              stroke:
                curve: smooth
              legend:
                show: true
              grid:
                padding:
                  right: 55
            series:
              - entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
                name: Thermostaat vraagt
                yaxis_id: temp
                color: "#FF9800"
                stroke_width: 2
                type: area
                opacity: 0.12
              - entity: sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur
                name: MPC advies
                yaxis_id: temp
                color: "#4CAF50"
                stroke_width: 2
              - entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                name: Stooklijn advies
                yaxis_id: temp
                color: "#26A69A"
                stroke_width: 1.5
              - entity: number.cic_max_water_temperature
                name: Ingestelde limiet
                yaxis_id: temp
                color: "#F44336"
                stroke_width: 3
              - entity: sensor.quatt_warmteanalyse_aanvoertemperatuur
                name: Werkelijke aanvoer
                yaxis_id: temp
                color: "#2196F3"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Databronnen: welke integratie levert welke meting ──
      - type: grid
        cards:
          - type: markdown
            title: Databronnen
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_databronnen' %}

              {% set rollen = state_attr(s, 'roles') or {} %}

              {% set ontbreekt = state_attr(s, 'missing_roles') or [] %}

              Actief: **{{ states(s) }}** — {{ state_attr(s, 'roles_resolved') }} van
              {{ state_attr(s, 'roles_total') }} metingen hebben een bron.

              | Meting | Integratie | Entiteit |

              |:--|:--|:--|

              {% for rol, info in rollen.items() -%}

              | {{ rol }} | {% if info.integration %}{{ info.integration }}{% else %}**geen**{% endif %} | {% if info.entity %}`{{ info.entity }}`{% else %}*—*{% endif %} |

              {% endfor %}

              {% if ontbreekt %}

              > Zonder bron: {{ ontbreekt | join(', ') }}. Deze metingen leveren niets, ook niet aan de analyse.

              {% endif %}

              {% set stats = 'sensor.quatt_warmteanalyse_data_statistieken' %}

              {% set cache_nieuwste = state_attr(stats, 'cache_newest') %}

              {% set cache_dagen = state_attr(stats, 'cache_days') | int(0) %}

              {% if state_attr(s, 'cloud_enabled') == false %}

              **Quatt cloud staat uit** — nieuwe dagen komen uit de recorder. De
              opgebouwde cache ({{ cache_dagen }} dagen{% if cache_nieuwste %}, t/m {{ cache_nieuwste }}{% endif %})
              blijft meedoen voor de historie, maar groeit niet meer.

              {% if cache_nieuwste %}

              {% set achterstand = (now().date() - strptime(cache_nieuwste, '%Y-%m-%d').date()).days %}

              {% if achterstand > 1 %}

              > Je draait {{ achterstand }} dagen op eigen data. Dat is de bedoeling zolang de cloud uit staat.

              {% endif %}

              {% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Aanvoertemperatuur begrenzing — huidige status ──
      - type: grid
        visibility:
          - condition: state
            entity: sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling
            state_not:
              - unavailable
              - unknown
        cards:
          - type: markdown
            title: Aanvoertemperatuur begrenzing
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling' %}

              {% set setpoint = states('sensor.quatt_warmteanalyse_thermostaat_setpoint') | float(none) %}

              {% set limiet = states('number.cic_max_water_temperature') | float(none) %}

              {% set werkelijk = states('sensor.quatt_warmteanalyse_aanvoertemperatuur') | float(none) %}

              {% set bron_aanvoer = state_attr('sensor.quatt_warmteanalyse_aanvoertemperatuur', 'source_integration') %}

              {% set mpc = states('sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur') | float(none) %}

              {% set stooklijn = states('sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur') | float(none) %}

              {% set last_at = state_attr(s, 'last_written_at') %}

              {% set interval = state_attr(s, 'interval_minutes') | int(30) %}

              {% set geconfigureerd = state_attr(s, 'source') | default('stooklijn') %}

              De bijsturing stuurt op **{{ geconfigureerd }}** en schrijft elke {{ interval }} min
              de maximale aanvoertemperatuur naar de warmtepomp.

              | | Waarde |

              |:--|--:|

              | MPC advies | {% if mpc %}{% if geconfigureerd == 'mpc' %}**{{ mpc | round(1) }}°C** ◀{% else %}{{ mpc | round(1) }}°C{% endif %}{% else %}*niet beschikbaar*{% endif %} |

              | Stooklijn advies | {% if stooklijn %}{% if geconfigureerd == 'stooklijn' %}**{{ stooklijn | round(1) }}°C** ◀{% else %}{{ stooklijn | round(1) }}°C{% endif %}{% else %}*n/b*{% endif %} |

              | Ingestelde limiet | {% if limiet %}**{{ limiet | round(1) }}°C**{% else %}*n/b*{% endif %} |

              | Thermostaat vraagt | {% if setpoint %}{{ setpoint | round(1) }}°C{% else %}*n/b*{% endif %} |

              | Werkelijke aanvoer | {% if werkelijk %}{{ werkelijk | round(1) }}°C{% if bron_aanvoer %} <small>via {{ bron_aanvoer }}</small>{% endif %}{% else %}*n/b*{% endif %} |

              | **Verlaging** | {% if setpoint and limiet %}{% set v = setpoint - limiet %}{% if v > 0 %}**−{{ v | round(1) }}°C**{% else %}niet actief{% endif %}{% else %}*n/b*{% endif %} |

              | Laatste update | {% if last_at %}{{ last_at[:16] | replace('T',' ') }}{% else %}*nog niet geschreven*{% endif %} |
            grid_options:
              columns: full
              rows: auto

      # ── Vermogen warmtepomp + gasketel (48 uur) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Warmtepomp & gasketel vermogen (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: power
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "W"
            apex_config:
              chart:
                height: 280
              stroke:
                curve: stepline
              legend:
                show: true
            series:
              - entity: sensor.quatt_warmteanalyse_thermisch_vermogen
                name: HP vermogen
                yaxis_id: power
                color: "#FF5722"
                stroke_width: 2
                type: area
                opacity: 0.15
              - entity: sensor.quatt_warmteanalyse_ketelvermogen
                name: Gasketel
                yaxis_id: power
                color: "#FF9800"
                stroke_width: 2
                type: area
                opacity: 0.15
            grid_options:
              columns: full
              rows: auto

      # ── Aanvoer-fout (MPC error) — smoothness indicator (48 uur) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Afwijking MPC-advies (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: error
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 200
              stroke:
                curve: smooth
              annotations:
                yaxis:
                  - y: 2
                    borderColor: "#FF9800"
                    strokeDashArray: 4
                  - y: -2
                    borderColor: "#FF9800"
                    strokeDashArray: 4
                  - y: 0
                    borderColor: "#4CAF50"
                    strokeDashArray: 0
              legend:
                show: true
              grid:
                padding:
                  right: 100
            series:
              - entity: sensor.quatt_warmteanalyse_mpc_fout_aanvoertemperatuur
                name: MPC fout (advies − werkelijk)
                yaxis_id: error
                color: "#2196F3"
                stroke_width: 2
                type: area
                opacity: 0.1
            grid_options:
              columns: full
              rows: auto

      # ── Debiet & buitentemperatuur context (48 uur) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Debiet & buitentemperatuur (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: flow
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "l/h"
              - id: temp
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 220
              stroke:
                curve: smooth
              legend:
                show: true
              grid:
                padding:
                  right: 55
            series:
              - entity: sensor.quatt_warmteanalyse_debiet
                name: Debiet
                yaxis_id: flow
                color: "#03A9F4"
                stroke_width: 2
                type: area
                opacity: 0.1
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buitentemperatuur
                yaxis_id: temp
                color: "#78909C"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Geluidsniveau & gasketel status (alleen met compensatie aan) ──
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
            state_not:
              - unavailable
              - unknown
        cards:
          - type: history-graph
            title: Geluidsniveau & gasketel (48 uur)
            hours_to_show: 48
            entities:
              - entity: sensor.quatt_warmteanalyse_geluidsniveau
                name: Geluidsniveau
              - entity: binary_sensor.quatt_warmteanalyse_gasketel_actief
                name: Gasketel
              - entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
                name: Compensatie
            grid_options:
              columns: full
              rows: auto

      # ── Geluidsniveau compensatie (alleen zichtbaar als geconfigureerd) ──
      - type: grid
        visibility:
          - condition: state
            entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
            state_not:
              - unavailable
              - unknown
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
                state_not: unavailable
            card:
              type: markdown
              title: Geluidsniveau Compensatie
              content: >
                {% set sw =
                states('switch.quatt_warmteanalyse_geluidsniveau_compensatie') %}

                {% set level =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'current_level') %}

                {% set mpc_err =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'mpc_error') %}

                {% set hp =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'hp_active') %}

                {% set gas =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'gas_active') %}

                {% set boiler =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'boiler_heat_w') %}

                | | Status |

                |:--|:--|

                | Switch | {% if sw == 'on' %}Aan{% else %}Uit{% endif %} |

                | HP actief | {% if hp %}Ja{% else %}Nee{% endif %} |

                | Gas actief | {% if gas %}Ja ({{ boiler }} W){% else %}Nee{% endif %} |

                | Geluidsniveau | **{{ level | default('—') }}** |

                | MPC fout | {% if mpc_err is not none %}{{ mpc_err }}°C{%
                else %}*n/a*{% endif %} |


                {% if sw == 'on' %}

                {% if not hp %}

                HP inactief — geluidsniveau gereset naar '{{ state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie', 'effective_max') | default('normal') }}'.

                {% elif gas %}

                Gas actief ({{ boiler }} W) — geluidsniveau omhoog naar
                **{{ level }}**.

                {% elif mpc_err is not none and mpc_err < -2 %}

                Aanvoer te hoog (fout={{ mpc_err }}°C) — geluidsniveau omlaag
                naar **{{ level }}**.

                {% elif mpc_err is not none and mpc_err > 2 %}

                Aanvoer te laag (fout={{ mpc_err }}°C) — geluidsniveau staat al
                op **{{ level }}** (max).

                {% else %}

                Aanvoer op schema — geluidsniveau op **{{ level }}**.

                {% endif %}

                {% endif %}
            grid_options:
              columns: full
              rows: auto
