title: Quatt Warmteanalyse
views:
  # ─── VIEW 1: OVERZICHT ───────────────────────────────────────────────
  # Beantwoordt: "Hoe doet mijn warmtepomp het?"
  # Desktop: 2 kolommen | Mobiel: 1 kolom, alles gestapeld
  - title: Overzicht
    icon: mdi:home-thermometer
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Linkerkolom: COP & status ──
      - type: grid
        cards:
          - type: gauge
            entity: sensor.quatt_warmteanalyse_geschatte_actuele_cop
            name: COP nu
            min: 0
            max: 6
            severity:
              green: 3
              yellow: 2
              red: 0
            needle: true
            grid_options:
              columns: full
              rows: 3
          - type: tile
            entity: sensor.quatt_warmteanalyse_average_cop
            name: Gemiddelde COP
            icon: mdi:gauge
            color: green
          - type: tile
            entity: sensor.quatt_warmteanalyse_analysis_status
            name: Status
            icon: mdi:information-outline
          - type: button
            name: Analyse starten
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: quatt_stooklijn.run_analysis
            show_name: true
            show_icon: true
            icon_height: 28px
            grid_options:
              columns: full
              rows: 1

      # ── Rechterkolom: kengetallen ──
      - type: grid
        cards:
          - type: tile
            entity: sensor.quatt_warmteanalyse_heat_loss_coefficient
            name: Warmteverlies (W/K)
            icon: mdi:home-thermometer
            color: orange
          - type: tile
            entity: sensor.quatt_warmteanalyse_balance_point_temperature
            name: Balanspunt
            icon: mdi:thermometer-check
            color: cyan
          - type: tile
            entity: sensor.quatt_warmteanalyse_knee_temperature
            name: Knikpunt
            icon: mdi:chart-line-variant
            color: amber
          # Toont de echte Quatt-setpoint als die bestaat. Die sensor komt uit
          # de Quatt-integratie en wordt alleen aangemaakt bij een thermostaat
          # op de OpenTherm-ingang — niet op elk systeem. Ontbreekt hij, dan
          # valt de tile hieronder terug op het stooklijn-advies van deze
          # integratie (altijd beschikbaar). Een niet-bestaande entity wordt
          # door HA als 'unavailable' behandeld, dus de visibility-conditie klopt.
          - type: tile
            entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
            name: Quatt Setpoint
            icon: mdi:thermometer-chevron-up
            color: red
            visibility:
              - condition: state
                entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
            name: Stooklijn setpoint
            icon: mdi:thermometer-chevron-up
            color: red
            visibility:
              - condition: state
                entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
                state:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.quatt_warmteanalyse_last_analysis
            name: Laatste analyse
            icon: mdi:clock-check-outline
          - type: tile
            entity: text.quatt_warmteanalyse_analyse_startdatum
            name: Startdatum
            icon: mdi:calendar-start

      # ── Comfort chart (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:mini-graph-card
            name: Comfort & Temperaturen (7 dagen)
            hours_to_show: 168
            points_per_hour: 2
            line_width: 2
            show:
              labels: true
              points: false
            entities:
              - entity: sensor.quatt_warmteanalyse_kamertemperatuur
                name: Kamer
                color: "#E53935"
              - entity: sensor.quatt_warmteanalyse_kamer_setpoint
                name: Setpoint
                color: "#FF8A80"
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buiten
                color: "#78909C"
            grid_options:
              columns: full
              rows: auto

      # ── Snel advies (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Quatt advies
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit om advies te zien.*

              {% else %}

              {% set n =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'aantal_aanpassingen') | int(0) %}

              {% set sg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_advies') %}

              {% set vg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_advies') %}

              {% set bron =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_bron') %}

              {% set mw =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'max_water_advies') %}

              {% if n > 0 %}

              ⚠️ **{{ advies }}**


              {% if sg %}• {{ sg }}{% endif %}

              {% if vg %}• {{ vg }}{% endif %}

              {% if mw %}• {{ mw }}{% endif %}

              {% elif bron == 'openquatt' %}

              ✅ **Stookgrens staat goed.** Tc en Pr: zie de Power
              House-kalibratie.

              {% if mw %}• {{ mw }}{% endif %}

              {% elif bron == 'handmatig' %}

              ✅ **Wat je hebt ingevuld wijkt niet af van de meting**


              {% if sg %}• {{ sg }}{% endif %}

              {% if vg %}• {{ vg }}{% endif %}

              {% if mw %}• {{ mw }}{% endif %}

              {% else %}

              ℹ️ **Aanbevolen Quatt-instellingen**


              {% if sg %}• {{ sg }}{% endif %}

              {% if vg %}• {{ vg }}{% endif %}

              {% if mw %}• {{ mw }}{% endif %}

              {% endif %}


              *Ga naar het **Advies** tabblad voor alle details en
              stooklijnpunten.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 2: ANALYSE ─────────────────────────────────────────────────
  # Beantwoordt: "Wat zijn de details van mijn warmteprestaties?"
  - title: Analyse
    icon: mdi:chart-scatter-plot-hexbin
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Thermisch profiel (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Huis thermisch profiel
              show: true
            update_interval: 30min
            apex_config:
              chart:
                height: 350
              xaxis:
                min: EVAL:Date.now() - 36 * 3600000
                max: EVAL:Date.now()
                title:
                  text: Buitentemperatuur (°C)
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              yaxis:
                title:
                  text: Vermogen (W)
                min: 0
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(val) + ' W'; }
              tooltip:
                x:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              markers:
                size:
                  - 4
                  - 0
                  - 0
                  - 0
                  - 4
                  - 0
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_optimal_stooklijn_slope
                name: Dagelijkse warmtevraag
                extend_to: false
                show:
                  legend_value: false
                color: "#66BB6A"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_optimal_stooklijn_slope']?.attributes
                  || {};

                  const balanceTemp = Math.min(attrs.balance_temp ?? 20, 20);

                  const now = Date.now(), d = (attrs.scatter_data ||
                  []).filter(p => p.heat > 0 && p.temp < Math.min(balanceTemp,
                  19));

                  return d.map(p => [now - (20 - p.temp) * 3600000, p.heat]);
              - entity: sensor.quatt_warmteanalyse_optimal_stooklijn_slope
                name: Optimale stooklijn
                extend_to: false
                show:
                  legend_value: false
                color: "#4CAF50"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const st =
                  hass.states['sensor.quatt_warmteanalyse_optimal_stooklijn_slope'];

                  const s = parseFloat(st?.state), ic =
                  st?.attributes?.intercept;

                  if (isNaN(s) || ic == null) return [];

                  const now = Date.now(), pts = [], maxT = s !== 0 ?
                  Math.min(-ic/s, 19) : 19;

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
              - entity: sensor.quatt_warmteanalyse_quatt_warmteanalyse_slope
                name: Quatt stooklijn (geschat)
                extend_to: false
                show:
                  legend_value: false
                color: "#FFC107"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_quatt_warmteanalyse_slope']?.attributes
                  || {};

                  const s = attrs.slope_daily, ic = attrs.intercept_daily;

                  if (!s || ic == null) return [];

                  const now = Date.now(), pts = [], maxT = s !== 0 ?
                  Math.min(-ic/s, 19) : 19;

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
              - entity: sensor.quatt_warmteanalyse_freezing_performance_slope
                name: HP capaciteit (vorst)
                extend_to: false
                show:
                  legend_value: false
                color: "#1E88E5"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const st =
                  hass.states['sensor.quatt_warmteanalyse_freezing_performance_slope'];

                  const s = parseFloat(st?.state), ic =
                  st?.attributes?.intercept;

                  const maxT = st?.attributes?.knee_temperature ?? 2;

                  if (isNaN(s) || ic == null) return [];

                  const now = Date.now(), pts = [];

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
              - entity: sensor.quatt_warmteanalyse_gas_heat_loss_coefficient
                name: Gas data
                extend_to: false
                show:
                  legend_value: false
                color: "#FFB74D"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_gas_heat_loss_coefficient']?.attributes
                  || {};

                  const balanceTemp = attrs.balance_point ?? 20;

                  const now = Date.now(), d = (attrs.scatter_data ||
                  []).filter(p => p.heat > 0 && p.temp < balanceTemp);

                  return d.map(p => [now - (20 - p.temp) * 3600000, p.heat]);
              - entity: sensor.quatt_warmteanalyse_gas_heat_loss_coefficient
                name: Gas trendlijn
                extend_to: false
                show:
                  legend_value: false
                color: "#FF9800"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_gas_heat_loss_coefficient']?.attributes
                  || {};

                  const s = attrs.slope, ic = attrs.intercept;

                  if (!s || ic == null) return [];

                  const now = Date.now(), pts = [], maxT = s !== 0 ?
                  Math.min(-ic/s, 19) : 19;

                  for (let t = -10; t <= maxT; t += 0.5) {
                    const v = s*t+ic; if (v>0) pts.push([now - (20 - t) * 3600000, Math.round(v)]);
                  }

                  if (pts.length > 0) pts.push([now - (20 - maxT) * 3600000,
                  null]);

                  return pts;
            grid_options:
              columns: full
              rows: auto

      # ── COP chart (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: COP vs Buitentemperatuur
              show: true
            update_interval: 30min
            apex_config:
              chart:
                height: 300
              xaxis:
                min: EVAL:Date.now() - 36 * 3600000
                max: EVAL:Date.now()
                title:
                  text: Buitentemperatuur (°C)
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              yaxis:
                title:
                  text: COP
                min: 0
              tooltip:
                x:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              markers:
                size:
                  - 4
                  - 0
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_average_cop
                name: Dagelijkse COP
                extend_to: false
                show:
                  legend_value: false
                color: "#42A5F5"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_average_cop']?.attributes
                  || {};

                  const now = Date.now(), d = [...(attrs.cop_scatter_data ||
                  [])].filter(p => p.cop > 0 && p.temp < 20).sort((a, b) =>
                  a.temp - b.temp);

                  return d.map(p => [now - (20 - p.temp) * 3600000, p.cop]);
              - entity: sensor.quatt_warmteanalyse_average_cop
                name: COP trendlijn
                extend_to: false
                show:
                  legend_value: false
                color: "#1565C0"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_average_cop']?.attributes
                  || {};

                  const d = [...(attrs.cop_scatter_data || [])].filter(p =>
                  p.cop > 0 && p.temp < 20).sort((a, b) => a.temp - b.temp);

                  if (d.length < 2) return [];

                  const n = d.length, sumX = d.reduce((s,p) => s+p.temp, 0),
                  sumY = d.reduce((s,p) => s+p.cop, 0), sumXY = d.reduce((s,p)
                  => s+p.temp*p.cop, 0), sumX2 = d.reduce((s,p) =>
                  s+p.temp*p.temp, 0);

                  const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);

                  const intercept = (sumY - slope*sumX) / n;

                  const now = Date.now(), pts = [], minT = d[0].temp, maxT =
                  d[d.length-1].temp;

                  for (let t = minT; t <= maxT; t += 0.5) pts.push([now - (20 -
                  t) * 3600000, slope*t + intercept]);

                  pts.push([now - (20 - maxT) * 3600000, null]);

                  return pts;
            grid_options:
              columns: full
              rows: auto

      # ── Warmtevraag tabel ──
      - type: grid
        cards:
          - type: markdown
            title: Warmtevraag per temperatuur
            content: >
              {% set temps =
              state_attr('sensor.quatt_warmteanalyse_heat_loss_coefficient',
              'heat_at_temps') %}

              {% if temps %}

              Buiten | Vermogen | Warmte/dag | COP | Stroom/dag

              :--|--:|--:|--:|--:

              {% for t, data in temps.items() -%}

              **{{ t }}°C** | **{{ data.heat | round(0) | int }} W** | {{
              (data.heat * 24 / 1000) | round(1) }} kWh | {% if data.cop %}{{
              data.cop | round(2) }}{% else %}-{% endif %} | {% if data.cop and
              data.cop > 0 %}{{ ((data.heat * 24 / 1000) / data.cop) | round(1)
              }} kWh{% else %}-{% endif %}

              {% endfor %}

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Data & uitleg ──
      - type: grid
        cards:
          - type: markdown
            title: Databeschikbaarheid
            content: >
              {% set s =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'daily_days') %}

              {% if s is not none %}

              {% set daily =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'daily_days') | int(0) %}

              {% set hourly =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'hourly_hours') | int(0) %}

              {% set minutes =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'minute_minutes') | int(0) %}

              {% set c_days =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'cache_days') | int(0) %}

              {% set c_old =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'cache_oldest') %}

              {% set c_new =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'cache_newest') %}

              {% set k_pts =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'knee_store_points') | int(0) %}

              {% set k_old =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'knee_store_oldest') %}

              {% set k_new =
              state_attr('sensor.quatt_warmteanalyse_data_statistieken',
              'knee_store_newest') %}

              | Dataset | Omvang |

              |:--------|-------:|

              | Daggemiddeldes | **{{ daily }} dagen** |

              | Uurwaarden | **{{ hourly }} uur** |

              | Minuutwaarden | **{{ minutes }} min** |

              | Knie-datastore | **{{ k_pts }} ptn**{% if k_old %} ({{
              k_old[:7] }} – {{ k_new[:7] }}){% endif %} |

              | API-cache | **{{ c_days }} dagen**{% if c_old %} ({{
              c_old[:7] }} – {{ c_new[:7] }}){% endif %} |

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: markdown
            title: Wat betekenen de waarden?
            content: >
              {% set hlc =
              states('sensor.quatt_warmteanalyse_heat_loss_coefficient') %}

              {% set bp =
              states('sensor.quatt_warmteanalyse_balance_point_temperature') %}

              {% set knee =
              states('sensor.quatt_warmteanalyse_knee_temperature') %}

              {% set cop = states('sensor.quatt_warmteanalyse_average_cop') %}

              {% if hlc not in ['unknown', 'unavailable', 'None'] %}

              **Warmteverlies ({{ hlc }} W/K)** — Per graad kouder verliest
              je huis {{ hlc }} W. Lager = beter geïsoleerd.


              **Balanspunt ({{ bp }}°C)** — Boven deze buitentemp is geen
              verwarming nodig.


              {% if knee not in ['unknown', 'unavailable', 'None'] %}**Knikpunt ({{ knee }}°C)** — Onder deze temp moet de cv-ketel bijspringen.{% else %}**Knikpunt** — Nog niet bepaald. Daarvoor zijn uren nodig waarin de warmtepomp op vol vermogen draait, dus een koude periode.{% endif %}


              **COP ({{ cop }})** — Elke kWh stroom levert {{ cop }} kWh
              warmte.

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 3: ADVIES ──────────────────────────────────────────────────
  # Beantwoordt: "Wat moet ik bij Quatt laten aanpassen?"
  - title: Advies
    icon: mdi:lightbulb-on-outline
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Samenvatting (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: tile
            entity: sensor.quatt_warmteanalyse_quatt_advies_parameters
            name: Advies status
            icon: mdi:tune
            color: amber
          - type: tile
            entity: sensor.quatt_warmteanalyse_balance_point_temperature
            name: Balanspunt (optimaal)
            icon: mdi:thermometer-check
            color: cyan
          - type: tile
            entity: sensor.quatt_warmteanalyse_openquatt_balance_point
            name: OpenQuatt Balanspunt
            icon: mdi:home-thermometer-outline
            color: teal
          - type: markdown
            title: Advies samenvatting
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              {% set sg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_advies') %}

              {% set vg =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_advies') %}

              {% set sl =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stooklijn_advies') %}

              {% set n =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'aantal_aanpassingen') | int(0) %}

              {% set bron =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_bron') %}

              {% set mw =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'max_water_advies') %}

              {% if n > 0 %}

              Pas de volgende instelling aan:

              {% elif bron == 'openquatt' %}

              ✅ De stookgrens staat goed.

              {% elif bron == 'handmatig' %}

              ✅ Wat je in de opties hebt ingevuld wijkt niet af van de meting.

              {% else %}

              Stookgrens en vermogen zet je installateur; de maximale
              watertemperatuur zet je zelf in de Quatt-app. Aanbevolen waarden:

              {% endif %}


              {% if sg %}1. **Stookgrens:** {{ sg }}{% endif %}

              {% if vg %}2. **Vermogen:** {{ vg }}{% endif %}

              {% if mw %}3. **Max. watertemperatuur:** {{ mw }}{% endif %}

              {% if sl %}4. **Stooklijn:** {{ sl }}{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Stookgrens detail ──
      - type: grid
        cards:
          - type: markdown
            title: Stookgrens
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              {% set cur =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_huidig') %}

              {% set bron =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_bron') %}

              {% set opt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_optimaal') %}

              {% set txt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stookgrens_advies') %}

              | | Waarde |

              |:--|--:|

              | Ingesteld | {% if cur is not none %}**{{ cur }}°C**{% if bron
              == 'handmatig' %} *(handmatig ingevuld)*{% endif %}{% elif bron
              == 'openquatt' %}*niet uit te lezen*{% else %}*onbekend — vul in
              bij de integratie-opties*{% endif %} |

              | Aanbevolen (gemeten balanspunt) | {% if opt %}**{{ opt }}°C**{%
              else %}*onbekend*{% endif %} |


              {% if txt %}{{ txt }}{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Nominaal vermogen detail ──
      - type: grid
        cards:
          - type: markdown
            title: Nominaal vermogen (bij -10°C)
            content: >
              {% set advies =
              states('sensor.quatt_warmteanalyse_quatt_advies_parameters') %}

              {% if advies in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              {% set opt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_optimaal_w') %}

              {% set cur =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_huidig_w') %}

              {% set bron =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_bron') %}

              {% set txt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'nominaal_vermogen_advies') %}

              | | Waarde |

              |:--|--:|

              | Ingesteld | {% if cur is not none %}**{{ cur }} W** *(handmatig
              ingevuld)*{% elif bron == 'openquatt' %}*niet van toepassing*{% else
              %}*onbekend — vul in bij de integratie-opties*{% endif %} |

              | Aanbevolen (warmteverlies huis) | {% if opt %}**{{ opt }} W**{%
              else %}*onbekend*{% endif %} |


              {% if txt %}{{ txt }}{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Stooklijn breakpoints + chart (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Optimale stooklijn breakpoints
            content: >
              {% set punten =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stooklijn_punten') %}

              {% if punten %}

              {% set txt =
              state_attr('sensor.quatt_warmteanalyse_quatt_advies_parameters',
              'stooklijn_advies') %}

              {% if txt %}Voor OpenQuatt in Heating Curve-modus:{% else
              %}Wat je huis per buitentemperatuur aan aanvoer nodig heeft. Ter
              info: de Quatt CiC regelt niet op een stooklijn maar op stookgrens
              en vermogen.{% endif %}


              Buitentemp | Aanvoertemp

              :--|--:

              {% for bp in punten -%}

              **{{ bp.buiten_temp }}°C** | **{{ bp.aanvoer_temp }}°C**

              {% endfor %}


              {% if txt %}*{{ txt }}*{% endif %}

              {% else %}

              *Voer eerst een analyse uit.*

              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: custom:apexcharts-card
            header:
              title: Optimale stooklijn
              show: true
            update_interval: 30min
            apex_config:
              chart:
                height: 300
              xaxis:
                min: EVAL:Date.now() - 30 * 3600000
                max: EVAL:Date.now()
                title:
                  text: Buitentemperatuur (°C)
                labels:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              yaxis:
                title:
                  text: Aanvoertemperatuur (°C)
                min: 20
                max: 55
              tooltip:
                x:
                  formatter: >-
                    EVAL:function(val) { return Math.round(20 - (new
                    Date().getTime() - val) / 3600000) + '°C'; }
              markers:
                size:
                  - 5
                  - 0
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_openquatt_stooklijn
                name: Optimale breakpoints
                extend_to: false
                show:
                  legend_value: false
                color: "#4CAF50"
                type: line
                stroke_width: 0
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_openquatt_stooklijn']?.attributes
                  || {};

                  const bps = attrs.breakpoints || [];

                  if (!bps.length) return [];

                  const now = Date.now();

                  return bps.map(bp => [now - (20 - bp.buiten_temp) * 3600000,
                  bp.aanvoer_temp]);
              - entity: sensor.quatt_warmteanalyse_openquatt_stooklijn
                name: Optimale curve
                extend_to: false
                show:
                  legend_value: false
                color: "#4CAF50"
                type: line
                stroke_width: 2
                curve: straight
                data_generator: >
                  const attrs =
                  hass.states['sensor.quatt_warmteanalyse_openquatt_stooklijn']?.attributes
                  || {};

                  const bps = attrs.breakpoints || [];

                  if (!bps.length) return [];

                  const now = Date.now();

                  return bps.map(bp => [now - (20 - bp.buiten_temp) * 3600000,
                  bp.aanvoer_temp]);
            grid_options:
              columns: 12
              rows: auto

      # ── OpenQuatt info (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: OpenQuatt integratie
            content: >
              {% set bp =
              states('sensor.quatt_warmteanalyse_openquatt_balance_point') %}

              {% set curve =
              states('sensor.quatt_warmteanalyse_openquatt_stooklijn') %}

              {% if bp in ['unknown', 'unavailable', 'None'] %}

              *Voer eerst een analyse uit.*

              {% else %}

              Sensoren beschikbaar voor OpenQuatt automations:


              | Sensor | Waarde |

              |:--|--:|

              | Balanspunt | **{{ bp }}°C** |

              | Stooklijn breakpoints | **{{ curve }} punten** |

              | Advies buiten + kamer | **{{
              states('sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur')
              }}°C** |


              {% set kal = 'sensor.quatt_warmteanalyse_openquatt_power_house_kalibratie' %}

              {% set a = state_attr(kal, 'zero_power_temp') %}

              {% if a is not none %}

              **Power House-kalibratie** — {{ states(kal) }}

              | Parameter | Nu | Advies |

              |:--|--:|--:|

              | House cold temp | {{ state_attr(kal, 'cold_temp_huidig') }}°C |
              **{{ state_attr(kal, 'cold_temp') }}°C** |

              | Rated max house power | {{ state_attr(kal, 'rated_power_huidig')
              }} W | **{{ state_attr(kal, 'rated_power') }} W** |

              {% if state_attr(kal, 'zero_power_temp_geadviseerd') %}

              | Stookgrens | {{ state_attr(kal, 'zero_power_temp_huidig') }}°C |
              **{{ a }}°C** |


              De ingestelde stookgrens staat **{{ state_attr(kal,
              'stookgrens_afwijking_w') | abs }} W** van de meting af: zo veel
              vraagt de feedforward elke stookdag {% if state_attr(kal,
              'stookgrens_afwijking_w') > 0 %}te weinig{% else %}te veel{% endif
              %}. Pas de drie waarden samen aan — Tc en Pr hierboven horen bij
              het nieuwe nulpunt.

              {% else %}

              Stookgrens staat op **{{ a }}°C** en wordt overgenomen, niet
              geadviseerd: hij ligt binnen één knopstap van de meting ({{
              state_attr(kal, 'balanspunt_gemeten') }}°C, afwijking {{
              state_attr(kal, 'stookgrens_afwijking_w') }} W), en daaronder valt
              er niets te corrigeren.

              {% endif %}


              *{{ state_attr(kal, 'toelichting') }}* (bron: {{ state_attr(kal,
              'capaciteitsbron') }})

              {% endif %}


              {% set wv = 'sensor.quatt_warmteanalyse_warmtevraag' %}

              {% set vraag = states(wv) %}

              {% if vraag not in ['unknown', 'unavailable', 'None'] %}

              **Warmtevraag** — {{ vraag }} W bij {{ state_attr(wv,
              'buiten_temp') }}°C buiten, gerekend vanaf een nulpunt van {{
              state_attr(wv, 'nulpunt') }}°C ({{ state_attr(wv, 'nulpunt_bron')
              }}).

              {% if state_attr(wv, 'koppeling_actief') %}

              Deze waarde stuurt Power House rechtstreeks aan: ze vervangt de
              feedforward, terwijl de comfortterm, de clamp op Pr en de
              waterbegrenzer van de firmware blijven.{% if state_attr(wv,
              'firmware_bevestigt') %} De firmware bevestigt dat zelf met
              *demand source = external*.{% endif %}
              Leegmaken van `{{ state_attr(wv, 'bronhelper') }}` zet de installatie
              terug op haar eigen huismodel.

              {% if state_attr(wv, 'boven_firmware_plafond') %}

              ⚠️ De vraag ligt boven **Rated maximum house power** ({{
              state_attr(wv, 'firmware_plafond_w') }} W); de firmware kapt hem
              daar stilletjes af. Stel Pr bij via het huismodel hierboven.

              {% endif %}

              {% elif state_attr(wv, 'koppeling_ingesteld') %}

              ⚠️ **De koppeling staat goed ingesteld, maar de firmware gebruikt
              hem niet.** *Power House – demand source* meldt `{{
              state_attr(wv, 'firmware_feedforward') }}`, dus de installatie
              draait op haar eigen huismodel en verwerpt de gepubliceerde
              waarde. Controleer of de proxy een geldig getal doorgeeft.

              {% elif state_attr(wv, 'keuzeknop_entity') %}

              Niet gekoppeld — {{ state_attr(wv, 'koppeling') }}.

              {% endif %}

              {% endif %}


              {% if not state_attr(wv, 'koppeling_actief') %}Maak een HA-automation die deze waarden naar je OpenQuatt entiteiten schrijft.{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 4: HUISMODEL EN VOORUITBLIK ────────────────────────────────
  # Beantwoordt: "Wat adviseren de drie bronnen, en wat doet het huis straks?"
  # Heette "MPC" tot v0.10.7-beta.9.
  - title: Huismodel en vooruitblik
    icon: mdi:brain
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Status tegels (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: tile
            entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
            name: Advies buiten
            icon: mdi:thermometer-water
            color: blue
          - type: tile
            entity: sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur
            name: Advies buiten + kamer
            icon: mdi:brain
            color: green
          - type: tile
            entity: sensor.quatt_warmteanalyse_stooklijn_fout_aanvoertemperatuur
            name: Afwijking buiten
            icon: mdi:thermometer-alert
            color: blue
          - type: tile
            entity: sensor.quatt_warmteanalyse_mpc_fout_aanvoertemperatuur
            name: Afwijking buiten + kamer
            icon: mdi:thermometer-alert
            color: green
          - type: tile
            entity: sensor.quatt_warmteanalyse_veilige_uitlooptijd
            name: Veilige uitlooptijd
            icon: mdi:home-clock-outline
            color: orange
          - type: tile
            entity: sensor.quatt_warmteanalyse_opgeslagen_warmte
            name: Opgeslagen warmte
            icon: mdi:home-thermometer
            color: orange

      # ── Uitleg bij de tegels ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Hoe lees je dit?
            content: >
              **Advies** is de aanvoertemperatuur die het huis volgens de berekening nu nodig heeft. *Advies buiten + kamer* toont geen waarde als de kamer al op of boven het setpoint staat: dan is er geen warmtevraag.


              **Afwijking** is het advies min de werkelijke aanvoer. Het zegt niet dat het model fout zit. Negatief betekent dat de warmtepomp warmer stookt dan het advies, positief dat hij kouder stookt. Beide tonen geen waarde als er geen water circuleert.
            grid_options:
              columns: full

      # ── Lerend huismodel (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Lerend huismodel
            content: >
              {% set mpc =
              'sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur' %}

              {% set src = state_attr(mpc, 'model_source') %}

              {% if src %}

              {% set conv = state_attr(mpc, 'model_converged') %}

              {% set n = state_attr(mpc, 'model_n_updates') | int(0) %}

              {% set U = state_attr(mpc, 'model_U_wk') %}

              {% set C = state_attr(mpc, 'model_C_whk') %}

              {% set g = state_attr(mpc, 'model_g_solar') %}

              {% set tau = state_attr(mpc, 'model_tau_hours') %}

              {% set pc = state_attr(mpc, 'model_constant_gain_w') %}

              {% set nmin = state_attr(mpc, 'model_n_updates_min') | int(n) %}

              {% if conv %}

              | Parameter | Waarde | Betekenis |

              |:--|--:|:--|

              | Warmteverlies | **{{ U }} W/K** | Per °C kouder verliest
              je huis {{ U }} W |

              | Thermische massa | **{{ C }} Wh/K** | Hoe traag reageert
              je huis op veranderingen |

              | Tijdconstante | **{{ tau }} uur** | Tijd om 63% af te
              koelen zonder verwarming |

              | Zonnewinst | **{{ g }} W/(W/m²)** | Effectief raamoppervlak × glastransmissie |

              | Constante warmtewinst | **{{ pc }} W** | Warmte die niet van warmtepomp of zon komt, zoals bewoners en apparaten{% if state_attr(mpc, 'model_constant_gain_source') == 'warmteverliesanalyse' %} — vast uit de warmteverliesanalyse (balanspunt){% else %} — door het model geleerd{% endif %} |

              | Updates | **{{ n }}** ({{ (n / 24) | round(0) | int }}
              dagen) | |


              Bron: **{{ src }}** — het model leert elk uur bij.

              {% elif nmin < 48 %}

              Model is aan het leren... **{{ nmin }}/48 bruikbare uren**. De thermische massa leert alleen op uren met warmtevraag, dus buiten het stookseizoen kan dit stilstaan.


              Gebruikt nu het batch warmteverliesmodel als fallback.

              {% else %}

              Model heeft genoeg data (**{{ n }} updates**), maar de
              geleerde parameters zijn nog buiten fysisch bereik:

              | Parameter | Huidig | Verwacht |

              |:--|--:|--:|

              | Warmteverlies | {{ U }} W/K | 30–800 W/K |

              | Thermische massa | {{ C }} Wh/K | 500–30000 Wh/K |

              | Zonnewinst | {{ g }} W/(W/m²) | 0–20 |


              Wacht op meer koude uren waarbij de warmtepomp actief is —
              dan leert het model betrouwbare waarden.

              {% endif %}

              {% else %}

              *Model nog niet geladen. Start een analyse of wacht op het
              volgende uur.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Modelvergelijking 2R2C vs huidig (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Modelvergelijking — 2R2C tegenover het lerende huismodel
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_modelvergelijking' %}

              {% set gemeten = state_attr(s, 'gemeten') %}

              {% if not gemeten %}

              *Nog niet gemeten. De vergelijking draait elke 24 uur; na een
              herstart duurt het tien minuten voor de eerste meting.*

              {% else %}

              {% set rmse = state_attr(s, 'rmse_k') %}

              {% set ref = state_attr(s, 'reference_rmse_k') %}

              {% set niets = state_attr(s, 'persistence_rmse_k') %}

              {% set uren = state_attr(s, 'data_uren') | float(0) %}

              {% set train = state_attr(s, 'train_uren') | float(0) %}

              {% set nodig = state_attr(s, 'benodigde_train_uren') | float(0) %}

              {% set horizon = state_attr(s, 'horizon_uren') | int(12) %}

              {% if rmse is not none %}

              Fout in de voorspelde binnentemperatuur **{{ horizon }} uur
              vooruit**, gemeten op weken die niet in de fit zaten. Lager is
              beter.


              | Model | RMSE |

              |:--|--:|

              | Tweetoestand (2R2C) | **{{ rmse }}&nbsp;K** |

              | Lerend huismodel (1R1C) | {{ ref if ref is not none else '—' }}&nbsp;K |

              | Niets doen | {{ niets if niets is not none else '—' }}&nbsp;K |

              {% set gz = state_attr(s, 'gevelzon_rmse_k') %}{% if gz is not none %}| 2R2C, zon op de ramen | {{ gz }}&nbsp;K |{% endif %}


              {% set rr = state_attr(s, 'richting_ramen') %}{% if rr is not none %}Geleerd uit je data: ramen op **{{ rr | int }}°**{% set rp = state_attr(s, 'richting_panelen') %}{% if rp is not none %}, panelen op **{{ rp | int }}°**{% endif %} (90 oost · 180 zuid · 270 west). De raamrichting is alleen grof te leren: binnen ~45° voorspelt het model even goed.{% endif %}

              {% set winst = state_attr(s, 'verbetering_pct') %}

              {% if state_attr(s, 'accepted') %}

              ✅ **2R2C is beter**{% if winst %} — {{ winst | round(0) | int }}%
              scherper dan
              het model dat nu draait{% endif %}.

              {% if state_attr(s, 'goedgekeurd_voor_gebruik') %}

              **In gebruik** voor de uitlooptijd, de driftgrens van de
              prijsverschuiving en de kamerlijn in de vooruitblik. Het advies
              zelf rekent met de warmteverliesanalyse.

              {% else %}

              Nog niet in gebruik: {{ state_attr(s, 'goedkeuring') }}.
              Uitlooptijd en driftgrens rekenen met het lerende huismodel.

              {% endif %}

              {% set a = state_attr(s, 'afkoeling') %}{% if a and a.n and a.model is defined %}Afkoeling met de warmtepomp uit ({{ a.n }}× {{ a.uren | int }} uur, gemeten gemiddeld {{ a.model.gemeten_k }}&nbsp;K): 2R2C zit er gemiddeld {{ a.model.fout_gem_k }}&nbsp;K naast (spreiding {{ a.model.fout_rmse_k }}&nbsp;K){% if a.referentie is defined %}, het lerende huismodel {{ a.referentie.fout_gem_k }}&nbsp;K (spreiding {{ a.referentie.fout_rmse_k }}&nbsp;K){% endif %}.{% endif %}

              {% else %}

              ⏸️ **Nog niet overgenomen** — {{ state_attr(s, 'reason') }}.

              {% endif %}

              {% else %}

              ⏳ **{{ state_attr(s, 'reason') }}**


              Het meetlogboek bevat **{{ uren | round(0) | int }} uur**.
              Daarvan telt **{{ train | round(0) | int }} uur** als
              trainingsdata: de helft van de weken, in aaneengesloten stukken
              van minstens drie dagen. Er is **{{ nodig | round(0) | int }}
              uur** nodig voordat er gefit wordt; de andere weken dienen om op
              te toetsen.

              {% if nodig > 0 %}

              {{ ((train / nodig) * 100) | round(0) | int }}% van de benodigde
              trainingsdata. Het model leert op de vijfminutenmetingen, zodat
              meetelt wanneer binnen een uur de warmtepomp liep. Buiten het
              stookseizoen groeit het logboek wel, maar leert het weinig over
              hoe het huis op verwarming reageert.

              {% set klaar = state_attr(s, 'train_compleet_verwacht') %}

              {% if klaar %}

              {% if state_attr(s, 'huidige_week') == 'test' %}Deze week is
              een **testweek**: wat er nu gemeten wordt telt niet als
              trainingsdata, hoe lang de warmtepomp ook draait.
              {% endif %}De trainingsdata is naar verwachting compleet op
              **{{ (as_datetime(klaar) | as_local).strftime('%d-%m om %H:%M') }}**.
              De meting daarna (binnen een etmaal) geeft de eerste uitkomst.

              {% endif %}

              {% endif %}

              {% if ref is not none and niets is not none %}

              Intussen, op de testweken {{ horizon }} uur vooruit: lerend huismodel
              (1R1C) **{{ ref }} K**, niets doen **{{ niets }} K**. Lager is
              beter.

              {% endif %}

              {% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Zon: wat het huis leert en hoe goed de verwachting is (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Zonverwachting — hoe goed per vooruitkijktijd
            content: >
              {% set z = 'sensor.quatt_warmteanalyse_zonverwachting' %}

              {% set per = state_attr(z, 'per_vooruitkijktijd') %}

              {% if not state_attr(z, 'gemeten') or not per %}

              *Nog niet gescoord. Bij elke ophaling wordt vastgelegd wat
              Open-Meteo voor de komende twaalf uur verwacht; elk uur wordt dat
              naast de werkelijkheid gezet. De eerste getallen verschijnen na een
              paar uur daglicht.*

              {% else %}

              {% set ref = state_attr(z, 'referentie') %}

              Verwachte zon (W/m², horizontaal) naast {% if ref == 'zonnesensor'
              %}de **gemeten** zon (zonnesensor){% else %}de **laatste
              verwachting** voor hetzelfde uur — zonder zonnesensor meet dit hoe
              veel de verwachting nog verschuift, niet hoe goed hij is{% endif
              %}. Alleen uren met daglicht.


              {% set ns = namespace(tbl='| Vooruit | Uren | Gem. afwijking | Gem. fout | Helderheid aanhouden |\n|:--|--:|--:|--:|--:|\n') %}{% for lead in ['1', '2', '3', '6', '12'] %}{% set e = per[lead] %}{% set ns.tbl = ns.tbl ~ '| ' ~ lead ~ ' u | ' ~ e.n ~ ' | ' ~ (e.bias ~ ' W/m²' if e.bias is defined else '—') ~ ' | ' ~ (e.mae ~ ' W/m²' if e.mae is defined else '—') ~ ' | ' ~ (e.persistentie_mae ~ ' W/m² (verwachting ' ~ e.verwachting_mae_zelfde_uren ~ ')' if e.persistentie_mae is defined else '—') ~ ' |\n' %}{% endfor %}

              {{ ns.tbl }}

              {% set f = state_attr(z, 'correctiefactor') %}{% if f %}
              **Correctiefactor** (gemeten / verwacht, 1–6 u vooruit, 14 dagen):
              **{{ f }}**.{% endif %}
              {% if state_attr(z, 'reden') %} {{ state_attr(z, 'reden') }}.{% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: custom:apexcharts-card
            header:
              title: Zon vandaag — verwacht en gemeten
              show: true
            graph_span: 36h
            span:
              start: day
            update_interval: 15min
            yaxis:
              - min: 0
                decimals: 0
                apex_config:
                  title:
                    text: W/m²
            series:
              - entity: sensor.quatt_warmteanalyse_zonverwachting
                name: Gemeten
                color: "#F9A825"
                type: area
                opacity: 0.3
                stroke_width: 2
                extend_to: false
                show:
                  legend_value: false
                data_generator: >
                  const a = entity.attributes.vandaag || [];
                  return a.filter(p => p.gemeten != null).map(p => [new
                  Date(p.tijd).getTime() + 1800000, p.gemeten]);
              - entity: sensor.quatt_warmteanalyse_zonverwachting
                name: Verwacht (1 u vooruit)
                color: "#1E88E5"
                type: line
                stroke_width: 2
                extend_to: false
                show:
                  legend_value: false
                data_generator: >
                  const a = entity.attributes.vandaag || [];
                  return a.filter(p => p.verwacht_1u != null).map(p => [new
                  Date(p.tijd).getTime() + 1800000, p.verwacht_1u]);
              - entity: sensor.quatt_warmteanalyse_zonverwachting
                name: Laatste verwachting
                color: "#90A4AE"
                type: line
                stroke_width: 1
                extend_to: false
                show:
                  legend_value: false
                data_generator: >
                  const a = entity.attributes.vandaag || [];
                  return a.filter(p => p.verwacht_laatste != null).map(p => [new
                  Date(p.tijd).getTime() + 1800000, p.verwacht_laatste]);
            grid_options:
              columns: full
              rows: auto
          - type: custom:apexcharts-card
            header:
              title: Leren over de zon — per meting
              show: true
            graph_span: 30d
            update_interval: 1h
            yaxis:
              - id: g
                min: 0
                decimals: 1
                apex_config:
                  title:
                    text: Zonfactor (m²)
              - id: fout
                opposite: true
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: Fout zonverwachting 3 u (W/m²)
            series:
              - entity: sensor.quatt_warmteanalyse_modelvergelijking
                attribute: zonfactor_horizontaal
                name: Zonfactor horizontaal (Open-Meteo)
                yaxis_id: g
                color: "#90A4AE"
                type: line
                stroke_width: 2
                extend_to: false
                show:
                  legend_value: false
              - entity: sensor.quatt_warmteanalyse_modelvergelijking
                attribute: zonfactor_gevel
                name: Zonfactor op de ramen (zonnesensor)
                yaxis_id: g
                color: "#F9A825"
                type: line
                stroke_width: 2
                extend_to: false
                show:
                  legend_value: false
              - entity: sensor.quatt_warmteanalyse_zonverwachting
                name: Fout zonverwachting 3 u vooruit
                yaxis_id: fout
                color: "#1E88E5"
                type: line
                stroke_width: 1
                extend_to: false
                group_by:
                  func: avg
                  duration: 1d
                show:
                  legend_value: false
            grid_options:
              columns: full
              rows: auto

      # ── Veilige uitlooptijd / comfort-vloer (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Veilige uitlooptijd
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_veilige_uitlooptijd' %}

              {% set coast = states(s) %}

              {% if coast not in ['unknown', 'unavailable', 'none'] %}

              {% set mins = coast | int(0) %}

              {% set floor = state_attr(s, 'comfort_floor') %}

              {% set at_risk = state_attr(s, 'comfort_at_risk') %}

              {% set reaches = state_attr(s, 'reaches_floor') %}

              ### 🏠⏱️ {{ (mins / 60) | round(1) }} uur  _( {{ mins }} min )_


              Zo lang kan het huis met de **warmtepomp uit** uitlopen op zijn
              thermische massa vóór de binnentemperatuur de comfort-vloer van
              **{{ floor }}°C** raakt. De Open-Meteo zon-forecast telt mee —
              meer voorspelde zon ⇒ langere uitlooptijd.


              {% if not reaches %}☀️ **Komt binnen 12 uur niet onder de
              comfort-vloer** — ruim voldoende warmte/zon op voorraad.

              {% elif at_risk %}⚠️ Bereikt de comfort-vloer binnen het
              simulatievenster — knijp de WP niet te lang.

              {% endif %}

              {% set herstel = state_attr(s, 'recovery_on_min_minutes') %}

              {% set doel = state_attr(s, 'recovery_target') %}

              {% if reaches and doel is not none %}{% if herstel is not none %}🔁
              Daarna terug naar **{{ doel }}°C** met de warmtepomp op zijn
              minimum: **{{ (herstel / 60) | round(1) }} uur**.{% else %}🔁 Op
              zijn minimum komt de warmtepomp daarna niet binnen 12 uur terug op
              **{{ doel }}°C**: het minimum ligt nauwelijks boven het
              warmteverlies, dus hij moet hoger draaien om de uitloop terug te
              betalen.{% endif %}

              {% endif %}


              Bruikbaar als comfort-grens voor sturing van buitenaf: knijp de
              warmtepomp alleen zolang deze tijd boven je eigen marge ligt, en geef
              comfort voorrang zodra hij daaronder zakt.

              {% else %}

              *Nog niet beschikbaar — het RC-model is nog niet geconvergeerd, of
              de sensor bestaat nog niet na een herstart/update. Sturing die hierop
              leunt moet zolang op een eigen terugval draaien.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Vooruitblik (volle breedte) ──
      #
      # Twaalf uur, gelijk aan het venster van de uitlooptijd. De titel
      # leest het aantal uren uit het attribuut in plaats van het te
      # herhalen — anders loopt hij weg zodra MPC_FORECAST_HOURS wijzigt.
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Vooruitblik
            content: >
              {% set mpc =
              'sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur' %}

              {% set fc = state_attr(mpc, 'forecast') %}

              {% set src = state_attr(mpc, 'model_source') %}

              {% if fc and fc | length > 0 %}

              ### Komende {{ fc | length }} uur

              {% set ns = namespace(tbl='| Uur | T buiten | T binnen | T binnen (2R2C) | Buffer | HP | Vermogen | Aan | Aanvoer | Aanvoer (geen zon) |\n|:--|--:|--:|--:|--:|:--:|--:|--:|--:|--:|\n') %}{% for h in fc %}{% set t_in = h.get('t_indoor_predicted') %}{% set t_2r = h.get('t_indoor_2r2c') %}{% set buf = h.get('stored_heat_kwh') %}{% set ns_val = h.get('supply_temp_no_solar') %}{% set ns.tbl = ns.tbl + '| **+' + h.hour|string + '** | ' + (h.temp_forecast|round(1))|string + '°C | ' + (t_in|string + '°C' if t_in is not none else '-') + ' | ' + (t_2r|string + '°C' if t_2r is not none else '-') + ' | ' + (buf|string + ' kWh' if buf is not none else '-') + ' | ' + ('🔥' if h.get('hp_needed') else '⏸️') + ' | ' + (h.get('q_hp_needed_w')|string + ' W' if h.get('q_hp_needed_w') is not none else '-') + ' | ' + (h.get('aan_pct')|string + '%' if h.get('aan_pct') is not none and h.get('hp_needed') else '-') + ' | ' + (h.supply_temp|string + '°C' if h.supply_temp is not none else '-') + ' | ' + (ns_val|string + '°C' if ns_val is not none else '-') + ' |\n' %}{% endfor %}

              {{ ns.tbl }}

              {% set mv = state_attr(mpc, 'minimumvermogen') %}

              {% if mv %}{% set pb = mv.per_buitentemperatuur %}**Aan:** deel van
              het uur dat de warmtepomp draait. Onder zijn minimum
              ({{ pb.values() | min }}–{{ pb.values() | max }} W, geleerd uit
              {{ mv.monsters }} metingen) levert hij in blokken: aan op het
              minimum, daarna uit.{% else %}**Aan:** verschijnt zodra het
              minimumvermogen van de warmtepomp uit genoeg stabiele runs geleerd
              is.{% endif %}


              {% set k2 = state_attr(mpc, 'kamer_2r2c') %}

              **T binnen (2R2C):** wat het vermogen uit de tabel met de kamer
              doet volgens het 2R2C-model, dat de kamer beter voorspelt maar het
              vermogen niet stuurt.{% if k2 and k2.fout_12u_k is not none %}
              Gemeten fout twaalf uur vooruit: {{ k2.fout_12u_k }} K.{% elif k2
              and k2.reden %} Nu leeg: {{ k2.reden }}.{% endif %}


              {% if state_attr(mpc, 'vooruitblik_basis') == 'zonder_huismodel' %}
              **Zonder huismodel:** het vermogen per uur is het advies bij de
              verwachte buitentemperatuur. Het extra vermogen om een kamer onder
              het setpoint bij te trekken telt alleen in uur +0: hoe snel de
              kamer daarna bijtrekt is zonder huismodel niet te zeggen. T binnen
              en Buffer blijven leeg tot het huismodel geleerd is.


              {% endif %}*Bron: {{ src | default('batch') }}*

              {% else %}

              *Geen forecast beschikbaar. Wacht op weersverwachting.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Aanvoertemperatuur vergelijking (volle breedte) ──
      #
      # Voorwaardelijk, en dat is geen cosmetiek. mini-graph-card haalt per
      # entity de historie op en blijft in een laadspinner hangen als een van
      # zijn reeksen er geen heeft. Buiten het stookseizoen staan beide
      # adviessensoren op 'unknown' — bewust: onder 30 L/h vergelijk je een
      # aanvoeradvies met stilstaand water — en dan draaide deze kaart maanden
      # achtereen een spinner in plaats van te zeggen dat er niets te tonen is.
      - type: grid
        column_span: 2
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                state_not: unknown
              - condition: state
                entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                state_not: unavailable
            card:
              type: custom:mini-graph-card
              name: Aanvoertemperatuur — Advies vs Werkelijk (24 uur)
              hours_to_show: 24
              points_per_hour: 4
              line_width: 1.5
              show:
                labels: true
                points: false
              entities:
                - entity: sensor.quatt_warmteanalyse_aanvoertemperatuur
                  name: Werkelijk
                  color: "#90A4AE"
                - entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                  name: Advies buiten
                  color: "#2196F3"
                - entity: sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur
                  name: Advies buiten + kamer
                  color: "#4CAF50"
                - entity: sensor.quatt_warmteanalyse_1r1c_aanbevolen_aanvoertemperatuur
                  name: Advies huismodel + kamer
                  color: "#FF9800"
            grid_options:
              columns: full
              rows: auto
          # Exact de tegenhanger van de conditie hierboven, inclusief
          # 'unavailable' — anders valt er tijdens een herstart een gat waarin
          # geen van beide kaarten staat.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                state:
                  - unknown
                  - unavailable
            card:
              type: markdown
              content: >
                **Aanvoertemperatuur — Advies vs Werkelijk**


                Geen vergelijking op dit moment: het debiet is
                {{ states('sensor.quatt_warmteanalyse_debiet') | float(0) | round(0) }} L/h.
                Onder de 30 L/h circuleert er niets en houden de adviessensoren
                zich stil — een aanvoeradvies afzetten tegen stilstaand water
                zegt niets. Zodra de pomp weer draait staat de grafiek hier
                vanzelf.
            grid_options:
              columns: full
              rows: auto

      # ── Foutmeting (volle breedte) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Afwijking — advies min werkelijk (24 uur)
              show: true
            graph_span: 24h
            apex_config:
              chart:
                height: 200
              yaxis:
                min: -10
                max: 10
                tickAmount: 4
              stroke:
                width: [2, 2]
                curve: smooth
                dashArray: [0, 4]
              annotations:
                yaxis:
                  - "y": 0
                    borderColor: "#999"
                    strokeDashArray: 4
                    borderWidth: 1
              legend:
                position: bottom
            series:
              - entity: sensor.quatt_warmteanalyse_stooklijn_fout_aanvoertemperatuur
                name: Afwijking buiten
                color: "#2196F3"
                stroke_width: 2
              - entity: sensor.quatt_warmteanalyse_mpc_fout_aanvoertemperatuur
                name: Afwijking buiten + kamer
                color: "#FF9800"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Buitentemperatuur context ──
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Buitentemperatuur (7 dagen)
            hours_to_show: 168
            points_per_hour: 1
            line_width: 1
            show:
              labels: true
              points: false
            entities:
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buitentemp
                color: "#78909C"
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 5: RENDEMENT & BESPARING ────────────────────────────────────
  # Beantwoordt: "Heeft mijn aanpassing geholpen, en zou goedkoper stoken lonen?"
  - title: Rendement & besparing
    icon: mdi:piggy-bank-outline
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Rendement: de enige gesloten lus rond een regelwijziging ──
      #
      # De norm is bevroren op de dagen vóór de grens en gebint per
      # seizoenshelft, zodat het getal zegt wat het belooft. Wat het niet kan,
      # staat er ook: binnen wat toeval kan geven hoort geen conclusie.
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Rendement
            content: >
              {% set cp = 'sensor.quatt_warmteanalyse_cop_prestatie' %}

              {% set ratio = states(cp) | float(none) %}

              {% if ratio is none %}

              *Nog geen rendementsmaat — er zijn stookdagen nodig om een norm te
              bouwen.*

              {% else %}

              {% set van = state_attr(cp, 'venster_van') %}

              {% set tot = state_attr(cp, 'venster_tot') %}

              {% set sinds = state_attr(cp, 'dagen_sinds_laatste_stookdag') | int(0) %}

              {% set bevroren = state_attr(cp, 'norm_bevroren') %}

              {% set grens = state_attr(cp, 'norm_grens') %}

              {% set handmatig = state_attr(cp, 'norm_grens_handmatig') %}

              {% set gevraagd = state_attr(cp, 'norm_grens_gevraagd') %}

              {% set spreiding = state_attr(cp, 'dagspreiding_pct') %}

              ### {{ ratio }} — rendement t.o.v. de eigen norm

              De norm is je eigen verleden: wat deze installatie bij déze
              buitentemperatuur en in dít deel van het seizoen zelf presteerde.
              Geen fabrieksopgave en geen vergelijking met andere huizen. 1,00 is
              precies zoals je het altijd deed, hoger is beter.

              | | Waarde |

              |:--|--:|

              | Laatste 30 stookdagen{% if van %} ({{ van }} → {{ tot }}){% endif %} | **{{ ratio }}** |

              | Norm gebouwd uit | {{ state_attr(cp, 'referentie_stookdagen') }} stookdagen{% if grens %} vóór {{ grens }}{% endif %} |

              | Beoordeeld | {{ state_attr(cp, 'beoordeelde_dagen') }} stookdagen |

              {% if spreiding %}

              | Dagspreiding | ±{{ spreiding }}% per dag |

              {% endif %}

              {% if not bevroren %}

              > **De norm is nog niet bevroren.** Er zijn te weinig stookdagen om
              de beoordeelde dagen erbuiten te houden, dus zitten ze in hun eigen
              norm en leest een verbetering structureel te laag. Dit lost zichzelf
              op zodra er een seizoen historie staat.

              {% elif gevraagd and not handmatig %}

              > **Je wijzigingsdatum {{ gevraagd }} is niet gebruikt.** Er staan te
              weinig stookdagen vóór die datum om er een norm op te bouwen. De
              grens schuift zolang mee met het venster.

              {% endif %}

              {% if sinds > 14 %}

              > **Buiten het stookseizoen.** De laatste stookdag was {{ sinds }}
              dagen geleden. Dit getal gaat over die periode en verandert niet tot
              de verwarming weer aan gaat.

              {% endif %}

              {% set na_n = state_attr(cp, 'na_dagen') | int(0) %}

              {% set na_totaal = state_attr(cp, 'na_dagen_totaal') | int(0) %}

              {% set voor_n = state_attr(cp, 'voor_dagen') | int(0) %}

              {% set verschil = state_attr(cp, 'verschil_pct') %}

              {% set drempel = state_attr(cp, 'verschil_grens_pct') %}

              ### {% if handmatig %}Heeft je aanpassing geholpen?{% else %}Vergelijking met dezelfde periode eerder{% endif %}

              {% if not grens %}

              Nog niet te zeggen: de norm bevat de beoordeelde dagen nog, dus er
              valt niets tegen af te zetten.

              {% elif na_totaal == 0 %}

              Nog geen stookdagen ná {{ grens }} om te beoordelen. Zodra er weer
              gestookt wordt verschijnt hier het verschil.

              {% elif not state_attr(cp, 'verschil_vergelijkbaar') %}

              Er zijn {{ na_totaal }} stookdagen ná {{ grens }}, maar geen daarvan
              valt in dezelfde periode van het jaar als de dagen ervóór
              ({{ state_attr(cp, 'voor_van') or 'geen' }}{% if state_attr(cp, 'voor_van') %} → {{ state_attr(cp, 'voor_tot') }}{% endif %}).
              Bij 10 °C in februari vraagt het huis nog warmte en draait de pomp
              lang; bij 10 °C in mei niet, en dat kost rendement zonder dat er iets
              aan de installatie mankeert. Zo'n vergelijking zou dus het seizoen
              meten en niet je aanpassing — daarom staat er geen getal. Zodra je
              dezelfde maanden een jaar later opnieuw hebt, verschijnt het hier.

              {% else %}

              **{{ '%+.1f'|format(verschil) }}%** over {{ na_n }}{% if na_n != na_totaal %} van de {{ na_totaal }}{% endif %} stookdagen sinds {{ grens }}{% if na_n != na_totaal %} (alleen de dagen die met dezelfde periode van het jaar te vergelijken zijn){% endif %}, tegen
              {{ voor_n }} stookdagen van
              {{ state_attr(cp, 'voor_van') }} → {{ state_attr(cp, 'voor_tot') }}.

              {% if state_attr(cp, 'verschil_significant') %}

              Dat is meer dan toeval waarschijnlijk geeft (grens ±{{ drempel }}%). {% if handmatig %}Ook andere veranderingen sinds die datum tellen mee, dus het is geen bewijs dat alleen deze aanpassing het deed.{% else %}Het zegt niet waardoor het komt: alles wat tussen die periodes veranderde, zit in dit getal.{% endif %}

              {% else %}

              {% if na_n < 7 %}Met {{ na_n }} vergelijkbare stookdagen is dat te weinig voor een conclusie; daarvoor zijn er minstens 7 nodig.{% else %}Dat valt binnen wat toeval kan geven (grens ±{{ drempel }}%), dus hier hoort nog geen conclusie aan te hangen.{% endif %}

              {% endif %}

              {% endif %}

              {% if not handmatig %}

              *De grens schuift mee met het venster: de laatste 30 stookdagen
              worden getoetst aan alles daarvóór. Verander je iets aan de regeling,
              zet die datum dan in de integratie-opties — dan blijft de norm daarop
              staan en meet je die aanpassing in plaats van de vorige maand.*

              {% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Prijsverschuiving (schaduwmeting) ──
      #
      # Alleen zichtbaar als er een tarief is ingesteld: zonder tarief maakt de
      # integratie de sensor niet aan, en HA behandelt een niet-bestaande
      # entity als 'unavailable' — dezelfde truc als in de Systeem-view.
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: sensor.quatt_warmteanalyse_prijsverschuiving
            state_not:
              - unavailable
              - unknown
        cards:
          - type: markdown
            title: Prijsverschuiving (schaduwmeting)
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_prijsverschuiving' %}

              {% set totaal = states(s) | float(0) %}

              {% set dagen = state_attr(s, 'gemeten_dagen') | int(0) %}

              {% set cop = state_attr(s, 'besparing_alleen_cop_eur') | float(0) %}

              {% set kosten = state_attr(s, 'kosten_vlak_eur') | float(0) %}

              {% set pct = state_attr(s, 'besparing_pct') %}

              {% set extra = state_attr(s, 'extra_stroom_kwh') | float(0) %}

              {% set ld = state_attr(s, 'laatste_dag') %}

              {% set ke = state_attr(s, 'komend_etmaal') %}

              {% set reden = state_attr(s, 'reden_geen_uitkomst') %}

              ### € {{ '%.2f' | format(totaal) }} over {{ dagen }} stookdag{{ '' if dagen == 1 else 'en' }}

              Wat het had opgeleverd om de warmte van elke stookdag te
              verschuiven naar de uren met de meeste warmte per euro. Er gaat
              evenveel warmte in, alleen op andere momenten. Uitgangspunt is de
              warmte die het huismodel nodig heeft om het setpoint te houden,
              met zon en kamertemperatuur erin. **Er wordt niets
              aangestuurd**: dit is een voorspelling van het model, geen
              meting van je verbruik. γ zegt hoe ver de verdeling afbuigt van
              die zonder verschuiven; 0 is helemaal niet. Tarief: {{ state_attr(s, 'tariefbron') }}.

              | | Bedrag |

              |:--|--:|

              | Verschuiven op prijs én COP | **€ {{ '%.2f' | format(totaal) }}** |

              | Alleen naar de uren met de beste COP | € {{ '%.2f' | format(cop) }} |

              | Wat de prijs toevoegt | € {{ '%.2f' | format(totaal - cop) }} |

              | Stroomkosten zonder verschuiven | € {{ '%.2f' | format(kosten) }}{% if pct is not none %} ({{ pct }}% bespaard){% endif %} |

              | Stroomverbruik door verschuiven | {{ '%+.1f' | format(extra) }} kWh |

              {% if ld %}

              **Laatste stookdag ({{ ld.datum }}):** γ {{ ld.gamma }}, €
              {{ '%.2f' | format(ld.besparing_eur) }} bespaard (alleen COP €
              {{ '%.2f' | format(ld.besparing_alleen_cop_eur) }}).
              {% if ld.drift_k is not none %}Kamer maximaal {{ (ld.drift_k | abs) | round(2) }} K
              kouder en {{ ld.overshoot_k | round(2) }} K warmer dan zonder
              verschuiven{% if ld.verlies_eur %}; het extra warmteverlies kostte €
              {{ '%.2f' | format(ld.verlies_eur) }}{% endif %}.{% endif %}

              {% endif %}

              {% if ke %}

              **Komend etmaal:** γ {{ ke.gamma }}, verwacht €
              {{ '%.2f' | format(ke.besparing_eur) }} (alleen COP €
              {{ '%.2f' | format(ke.besparing_alleen_cop_eur) }}) over
              {{ ke.venster_uren }} uur, op € {{ '%.2f' | format(ke.kosten_vlak_eur) }}
              stroomkosten zonder verschuiven.
              {% set pr = ke.uren | map(attribute='prijs') | list %}
              {% if pr %}Prijsverschil in dit venster:
              {{ '%.1f' | format((pr | max - pr | min) * 100) }} ct/kWh.{% endif %}
              {% if ke.minimumvermogen %}Verschoven in aan/uit-blokken: elk
              kwartier uit of op minstens het minimum van de warmtepomp{% if
              ke.uren_onder_minimum %} ({{ ke.uren_onder_minimum }} uur bleef
              eronder){% endif %}.{% endif %}

              {% endif %}

              {% if reden %}

              > Nu geen uitkomst: {{ reden }}.

              {% endif %}

              {% if dagen == 0 %}

              *De telling begint bij de eerste nachtmeting (00:05) op een dag met
              warmtevraag. Zomerdagen tellen niet mee.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: custom:apexcharts-card
            header:
              title: Komend etmaal — warmtevraag zonder en met verschuiven
              show: true
            graph_span: 24h
            span:
              start: hour
            now:
              show: true
            yaxis:
              - id: w
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "W"
              # Zachte nul: bij een vast normaal/dal-tarief liggen de prijzen
              # vaak een paar tiende cent uit elkaar, en een automatisch
              # geschaalde as blaast dat op tot een sprong over de hele hoogte.
              # Een dynamische reeks mag er nog steeds onder zakken.
              - id: eur
                opposite: true
                min: "~0"
                decimals: 3
                apex_config:
                  title:
                    text: "€/kWh"
            apex_config:
              chart:
                height: 280
              legend:
                show: true
            series:
              - entity: sensor.quatt_warmteanalyse_prijsverschuiving
                name: Zonder verschuiven
                unit: W
                float_precision: 0
                show:
                  legend_value: false
                yaxis_id: w
                type: area
                curve: stepline
                color: "#9E9E9E"
                opacity: 0.25
                stroke_width: 1.5
                data_generator: |
                  const u = entity.attributes?.komend_etmaal?.uren || [];
                  return u.map(h => [new Date(h.tijd).getTime(), h.vlak_w]);
              - entity: sensor.quatt_warmteanalyse_prijsverschuiving
                name: Verschoven
                unit: W
                float_precision: 0
                show:
                  legend_value: false
                yaxis_id: w
                type: line
                curve: stepline
                color: "#4CAF50"
                stroke_width: 2.5
                data_generator: |
                  const u = entity.attributes?.komend_etmaal?.uren || [];
                  return u.map(h => [new Date(h.tijd).getTime(), h.verschoven_w]);
              - entity: sensor.quatt_warmteanalyse_prijsverschuiving
                name: Minimum WP
                unit: W
                float_precision: 0
                show:
                  legend_value: false
                  in_chart: true
                yaxis_id: w
                type: line
                curve: stepline
                color: "#607D8B"
                stroke_width: 1
                data_generator: |
                  const u = entity.attributes?.komend_etmaal?.uren || [];
                  return u.filter(h => h.min_w != null)
                          .map(h => [new Date(h.tijd).getTime(), h.min_w]);
              - entity: sensor.quatt_warmteanalyse_prijsverschuiving
                name: Stroomprijs
                unit: €/kWh
                float_precision: 4
                show:
                  legend_value: false
                yaxis_id: eur
                type: line
                curve: stepline
                color: "#FF9800"
                stroke_width: 1.5
                data_generator: |
                  const u = entity.attributes?.komend_etmaal?.uren || [];
                  return u.map(h => [new Date(h.tijd).getTime(), h.prijs]);
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              title: Komend etmaal — kamertemperatuur zonder en met verschuiven
              show: true
            graph_span: 24h
            span:
              start: hour
            now:
              show: true
            yaxis:
              - id: c
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 240
              legend:
                show: true
            series:
              - entity: sensor.quatt_warmteanalyse_prijsverschuiving
                name: Zonder verschuiven
                unit: °C
                float_precision: 2
                show:
                  legend_value: false
                yaxis_id: c
                type: line
                color: "#9E9E9E"
                stroke_width: 2
                data_generator: |
                  const u = entity.attributes?.komend_etmaal?.uren || [];
                  return u.filter(h => h.kamer_vlak_c != null)
                          .map(h => [new Date(h.tijd).getTime(), h.kamer_vlak_c]);
              - entity: sensor.quatt_warmteanalyse_prijsverschuiving
                name: Verschoven
                unit: °C
                float_precision: 2
                show:
                  legend_value: false
                yaxis_id: c
                type: line
                color: "#4CAF50"
                stroke_width: 2.5
                data_generator: |
                  const u = entity.attributes?.komend_etmaal?.uren || [];
                  return u.filter(h => h.kamer_verschoven_c != null)
                          .map(h => [new Date(h.tijd).getTime(), h.kamer_verschoven_c]);
            grid_options:
              columns: full
          - type: markdown
            content: >-
              {% set ke = state_attr('sensor.quatt_warmteanalyse_prijsverschuiving', 'komend_etmaal') %}
              {% set k = ke.kamer if ke else none %}
              {% if k and k.reden is none %}
              Kamertemperatuur volgens het 2R2C-model, geen meting. Het model zit
              twaalf uur vooruit gemiddeld {{ '%.2f' | format(k.fout_12u_k) }} K
              naast de meting. Vertrouw vooral het verschil tussen de lijnen:
              verschuiven verandert de kamer met
              {{ '%+.2f' | format(k.afwijking_min_k) }} tot
              {{ '%+.2f' | format(k.afwijking_max_k) }} K. De driftgrens rekent
              met het lerende huismodel op {{ '%+.2f' | format(ke.drift_k) }} K.
              {% elif k %}
              Nog geen kamertemperatuur: {{ k.reden }}.
              {% endif %}
            grid_options:
              columns: full
              rows: auto

  # ─── VIEW 6: SYSTEEM ────────────────────────────────────────────────
  # Beantwoordt: "Waar komen mijn metingen vandaan en hoe stookt het systeem?"
  #
  # Soundslider-sturing (sound_level_enabled) en max. aanvoertemperatuur
  # (ch_max_water_enabled) zijn opt-in: staan ze uit, dan bestaan hun
  # entiteiten niet en tonen hun kaarten alleen foutmeldingen. De secties
  # hangen daarom aan een visibility-conditie. HA behandelt een niet-
  # bestaande entity als 'unavailable', dus de sectie verdwijnt vanzelf —
  # dezelfde truc als bij de Quatt-setpoint tile in de Overzicht-view.
  - title: Systeem
    icon: mdi:tune-variant
    type: sections
    max_columns: 2
    cards: []
    sections:
      # ── Keuzehulp: welke knop past bij deze installatie ──
      # Leest alles uit de sturingssensor (regelaar, knoppen,
      # ketel_springt_bij). Wat niet vast te stellen is, krijgt de algemene
      # tekst in plaats van een gok. Zie README "Choosing how to steer".
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: "Sturing: wat past bij jouw installatie"
            content: |
              {%- set s = 'sensor.quatt_warmteanalyse_sturingseffect' -%}
              {%- set r = state_attr(s, 'regelaar') -%}
              {%- set k = state_attr(s, 'knoppen') or {} -%}
              {%- set mw = k.get('max_aanvoertemperatuur') or {} -%}
              {%- set sl = k.get('soundslider') or {} -%}
              {%- set wv = k.get('warmtevraag_naar_openquatt') -%}
              {%- set ketel = state_attr(s, 'ketel_springt_bij') -%}
              {%- set rc = 'sensor.quatt_warmteanalyse_1r1c_aanbevolen_aanvoertemperatuur' -%}
              {%- set mw_aan = mw.get('stand', 'uit') != 'uit' -%}
              {%- set sl_aan = sl.get('stand', 'uit') != 'uit' -%}
              {%- macro stand(knop) -%}{% if knop.get('stand', 'uit') == 'uit' %}uit{% else %}aan, op **{{ knop.get('naam') }}**{% endif %}{%- endmacro -%}
              **Regelaar:** {% if r == 'cic' %}Quatt CiC{% elif r == 'openquatt' %}OpenQuatt{% elif r == 'openquatt_power_house' %}OpenQuatt in Power House (de warmtevraag stuurt){% else %}niet vast te stellen{% endif %}

              | Knop | Staat | Past hier? |
              |:--|:--|:--|
              | Max. aanvoertemperatuur | {{ stand(mw) }} | {% if r == 'cic' %}Ja{% elif r == 'openquatt' %}Ja, buiten Power House; in Power House niet{% elif r == 'openquatt_power_house' %}Nee: in Power House is het een veiligheidsbegrenzer{% else %}CiC en OpenQuatt buiten Power House: ja. OpenQuatt in Power House: nee{% endif %} |
              | Soundslider-sturing | {{ stand(sl) }} | {% if r == 'cic' %}Ja{% elif r in ['openquatt', 'openquatt_power_house'] %}Nee, alleen voor de CiC{% else %}Alleen voor de CiC{% endif %} |
              | Warmtevraag naar OpenQuatt | {% if wv %}aan{% else %}uit{% endif %} | {% if r == 'cic' %}Nee, alleen voor OpenQuatt{% elif r in ['openquatt', 'openquatt_power_house'] %}Ja, als OpenQuatt in Power House draait{% else %}Alleen voor OpenQuatt in Power House{% endif %} |

              {% if mw_aan and sl_aan -%}
              - **Twee knoppen tegelijk.** Het sturingseffect vergelijkt combinaties van standen; met twee knoppen aan is niet te zien welke het verschil maakt. Begin met één.
              {% endif -%}
              {% if r == 'openquatt' and mw_aan -%}
              - Draait OpenQuatt in **Power House**? Dan is de max. aanvoertemperatuur een veiligheidsbegrenzer (terugregelen binnen 3 K, uitschakelen bij +5 K). Zet hem dan uit en gebruik de warmtevraag naar OpenQuatt.
              {% endif -%}
              {% if mw.get('stand') in ['1r1c', '1r1c_terugval'] or sl.get('stand') in ['1r1c', '1r1c_terugval'] -%}
              - **Huismodel + kamer** {% if state_attr(rc, 'terugval') %}leert nog: tot het model online is (ongeveer twee dagen stoken) stuurt het als *Buitentemperatuur + kamer*.{% else %}is online.{% endif %} Het is een bron om te meten, niet de aanbevolen keuze{% if ketel %}. De ketel springt bij: met vloerverwarming kan dit model dat niet volgen{% endif %}.
              {% endif -%}
              {% if mw.get('stand') == 'stooklijn' or sl.get('stand') == 'stooklijn' -%}
              - **Buitentemperatuur** weet niet of de kamer op temperatuur is. Alleen kiezen als kamertemperatuur of setpoint niet betrouwbaar gemeten wordt.
              {% endif -%}
              {% if not mw_aan and not sl_aan and not wv -%}
              Alles staat uit: het sturingseffect meet nu de referentie. **Startpunt:** {% if r == 'cic' %}één knop aan, op *Buitentemperatuur + kamer*.{% elif r == 'openquatt_power_house' %}de warmtevraag naar OpenQuatt.{% elif r == 'openquatt' %}buiten Power House de max. aanvoertemperatuur op *Buitentemperatuur + kamer*; in Power House de warmtevraag naar OpenQuatt.{% else %}de knop die bij je regelaar past, op *Buitentemperatuur + kamer*.{% endif %}
              {%- endif %}

              *Welke bron op jouw huis het zuinigst stuurt, kan deze kaart niet zeggen. Laat elke instelling een paar weken staan, één wijziging tegelijk, en vergelijk op de kaart Sturingseffect.*
            grid_options:
              columns: full
              rows: auto

      # ── Max. aanvoertemperatuur: ingesteld en gevraagd (48 uur) ──
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling
            state_not:
              - unavailable
              - unknown
        cards:
          - type: custom:apexcharts-card
            header:
              title: "Max. aanvoertemperatuur: ingesteld en gevraagd (48 uur)"
              show: true
            graph_span: 48h
            yaxis:
              - id: temp
                min: 15
                max: 60
                decimals: 0
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 300
              stroke:
                curve: smooth
              legend:
                show: true
              grid:
                padding:
                  right: 55
            series:
              - entity: sensor.quatt_warmteanalyse_thermostaat_setpoint
                name: Thermostaat vraagt
                yaxis_id: temp
                color: "#FF9800"
                stroke_width: 2
                type: area
                opacity: 0.12
              - entity: sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur
                name: Advies buiten + kamer
                yaxis_id: temp
                color: "#4CAF50"
                stroke_width: 2
              - entity: sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur
                name: Advies buiten
                yaxis_id: temp
                color: "#26A69A"
                stroke_width: 1.5
              - entity: sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling
                attribute: limit_c
                name: Max. aanvoertemperatuur
                yaxis_id: temp
                color: "#F44336"
                stroke_width: 3
              - entity: sensor.quatt_warmteanalyse_aanvoertemperatuur
                name: Werkelijke aanvoer
                yaxis_id: temp
                color: "#2196F3"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Databronnen: welke integratie levert welke meting ──
      - type: grid
        cards:
          - type: markdown
            title: Databronnen
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_databronnen' %}

              {% set rollen = state_attr(s, 'roles') or {} %}

              {% set ontbreekt = state_attr(s, 'missing_roles') or [] %}

              Actief: **{{ states(s) }}** — {{ state_attr(s, 'roles_resolved') }} van
              {{ state_attr(s, 'roles_total') }} metingen hebben een bron.

              | Meting | Integratie | Entiteit |

              |:--|:--|:--|

              {% for rol, info in rollen.items() -%}

              | {{ rol }} | {% if info.integration %}{{ info.integration }}{% else %}**geen**{% endif %} | {% if info.entity %}`{{ info.entity }}`{% else %}*—*{% endif %} |

              {% endfor %}

              {% if ontbreekt %}

              > Zonder bron: {{ ontbreekt | join(', ') }}. Deze metingen leveren niets, ook niet aan de analyse.

              {% endif %}

              {% set stats = 'sensor.quatt_warmteanalyse_data_statistieken' %}

              {% set cache_nieuwste = state_attr(stats, 'cache_newest') %}

              {% set cache_dagen = state_attr(stats, 'cache_days') | int(0) %}

              {% if state_attr(s, 'cloud_enabled') == false %}

              **Quatt cloud staat uit** — nieuwe dagen komen uit de recorder. De
              opgebouwde cache ({{ cache_dagen }} dagen{% if cache_nieuwste %}, t/m {{ cache_nieuwste }}{% endif %})
              blijft meedoen voor de historie, maar groeit niet meer.

              {% if cache_nieuwste %}

              {% set achterstand = (now().date() - strptime(cache_nieuwste, '%Y-%m-%d').date()).days %}

              {% if achterstand > 1 %}

              > Je draait {{ achterstand }} dagen op eigen data. Dat is de bedoeling zolang de cloud uit staat.

              {% endif %}

              {% endif %}

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Max. aanvoertemperatuur — huidige status ──
      - type: grid
        visibility:
          - condition: state
            entity: sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling
            state_not:
              - unavailable
              - unknown
        cards:
          - type: markdown
            title: Max. aanvoertemperatuur
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_max_aanvoertemperatuur_instelling' %}

              {% set setpoint = states('sensor.quatt_warmteanalyse_thermostaat_setpoint') | float(none) %}

              {% set limiet = state_attr(s, 'limit_c') | float(none) %}

              {% set werkelijk = states('sensor.quatt_warmteanalyse_aanvoertemperatuur') | float(none) %}

              {% set bron_aanvoer = state_attr('sensor.quatt_warmteanalyse_aanvoertemperatuur', 'source_integration') %}

              {% set mpc = states('sensor.quatt_warmteanalyse_mpc_aanbevolen_aanvoertemperatuur') | float(none) %}

              {% set stooklijn = states('sensor.quatt_warmteanalyse_aanbevolen_aanvoertemperatuur') | float(none) %}

              {% set rc = states('sensor.quatt_warmteanalyse_1r1c_aanbevolen_aanvoertemperatuur') | float(none) %}

              {% set rc_terugval = state_attr('sensor.quatt_warmteanalyse_1r1c_aanbevolen_aanvoertemperatuur', 'terugval') %}

              {% set last_at = state_attr(s, 'last_written_at') %}

              {% set interval = state_attr(s, 'interval_minutes') | int(30) %}

              {% set geconfigureerd = state_attr(s, 'source') | default('stooklijn') %}

              {% set marge = state_attr(s, 'margin_c') | float(none) %}

              Stuurt op **{{ state_attr(s, 'bron_naam') or geconfigureerd }}** en schrijft elke {{ interval }} min
              het advies{% if marge %} plus {{ marge | round(1) }}°C marge{% endif %} als maximale
              aanvoertemperatuur naar de warmtepomp.

              | | Waarde |

              |:--|--:|

              | Advies buiten + kamer | {% if mpc %}{% if geconfigureerd == 'mpc' %}**{{ mpc | round(1) }}°C** ◀{% else %}{{ mpc | round(1) }}°C{% endif %}{% else %}*niet beschikbaar*{% endif %} |

              | Advies buiten | {% if stooklijn %}{% if geconfigureerd == 'stooklijn' %}**{{ stooklijn | round(1) }}°C** ◀{% else %}{{ stooklijn | round(1) }}°C{% endif %}{% else %}*n/b*{% endif %} |

              | Advies huismodel + kamer | {% if rc %}{% if geconfigureerd == '1r1c' %}**{{ rc | round(1) }}°C** ◀{% else %}{{ rc | round(1) }}°C{% endif %}{% if rc_terugval %} <small>(leert nog: stuurt als buiten + kamer)</small>{% endif %}{% else %}*n/b*{% endif %} |

              | Marge boven advies | {% if marge is not none %}+{{ marge | round(1) }}°C{% else %}*n/b*{% endif %} |

              | Max. aanvoertemperatuur nu | {% if limiet %}**{{ limiet | round(1) }}°C**{% else %}*n/b*{% endif %} |

              | Thermostaat vraagt | {% if setpoint %}{{ setpoint | round(1) }}°C{% else %}*n/b*{% endif %} |

              | Werkelijke aanvoer | {% if werkelijk %}{{ werkelijk | round(1) }}°C{% if bron_aanvoer %} <small>via {{ bron_aanvoer }}</small>{% endif %}{% else %}*n/b*{% endif %} |

              | **Verlaging** | {% if setpoint and limiet %}{% set v = setpoint - limiet %}{% if v > 0 %}**−{{ v | round(1) }}°C**{% else %}niet actief{% endif %}{% else %}*n/b*{% endif %} |

              | Laatste update | {% if last_at %}{{ last_at[:16] | replace('T',' ') }}{% else %}*nog niet geschreven*{% endif %} |
            grid_options:
              columns: full
              rows: auto

      # ── Vermogen warmtepomp + gasketel (48 uur) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Warmtepomp & gasketel vermogen (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: power
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "W"
            apex_config:
              chart:
                height: 280
              stroke:
                curve: stepline
              legend:
                show: true
            series:
              - entity: sensor.quatt_warmteanalyse_thermisch_vermogen
                name: HP vermogen
                yaxis_id: power
                color: "#FF5722"
                stroke_width: 2
                type: area
                opacity: 0.15
              - entity: sensor.quatt_warmteanalyse_ketelvermogen
                name: Gasketel
                yaxis_id: power
                color: "#FF9800"
                stroke_width: 2
                type: area
                opacity: 0.15
            grid_options:
              columns: full
              rows: auto

      # ── Compressorstarts: kortcyclen zichtbaar maken ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Compressorstarts
            content: >
              {% set s = 'sensor.quatt_warmteanalyse_compressorstarts' %}

              {% set nu = states(s) | int(none) %}

              {% if nu is not none %}

              {% set etmaal = state_attr(s, 'starts_laatste_etmaal') | int(0) %}

              {% set looptijd = state_attr(s, 'gemiddelde_looptijd_min') %}

              {% set perdag = state_attr(s, 'starts_per_dag_7d') %}

              {% set buiten = states('sensor.quatt_warmteanalyse_buitentemperatuur') | float(none) %}

              ### {{ nu }} starts in het afgelopen uur

              | | Waarde |

              |:--|--:|

              | Laatste uur | **{{ nu }}** |

              | Laatste etmaal | {{ etmaal }} |

              | Gemiddeld per dag (7 dagen) | {% if perdag is not none %}{{ perdag }}{% else %}*nog te weinig historie*{% endif %} |

              | Gemiddelde looptijd | {% if looptijd is not none %}{{ looptijd }} min{% else %}*—*{% endif %} |

              | Draait nu | {% if state_attr(s, 'draait_nu') %}ja{% else %}nee{% endif %} |

              {% set pu = state_attr(s, 'per_unit') or {} %}

              {% if pu.get('hp2', {}).get('bron') %}

              Starts per unit, laatste etmaal: **hp1 {{ pu.hp1.starts_laatste_etmaal }}**,
              **hp2 {{ pu.hp2.starts_laatste_etmaal }}**. Het duo wisselt niet per start maar
              in blokken: de ene unit draait een periode alle beurten, daarna neemt de andere
              het over. Een etmaal met alles op één unit is dus normaal.
              {% if pu.hp1.draaiuren_7d is defined %}Over 7 dagen: hp1 {{ pu.hp1.draaiuren_7d }} u
              ({{ pu.hp1.starts_7d }} starts), hp2 {{ pu.hp2.draaiuren_7d }} u ({{ pu.hp2.starts_7d }}
              starts). Pas als die draaiuren ver uit elkaar liggen, doet één unit structureel
              het werk.{% endif %}

              {% endif %}

              {% if nu >= 3 and buiten is not none and buiten < 10 %}

              > **{{ nu }} starts per uur bij {{ buiten | round(1) }} °C buiten.** Kortcyclen bij
              koud weer betekent dat de warmtepomp meer levert dan het huis vraagt en zichzelf
              uitzet. Dat wijst op een te hoge stooklijn: kijk op het tabblad **Advies** of de
              geadviseerde aanvoertemperatuur lager ligt dan wat er nu ingesteld staat.

              {% elif nu >= 3 %}

              > Veel starts, maar het is {{ buiten | round(1) if buiten is not none else '?' }} °C
              buiten. Bij weinig warmtevraag is kortcyclen normaal — de pomp kan niet lager
              moduleren dan haar minimum. Pas onder ongeveer 10 °C zegt dit getal iets over de
              stooklijn.

              {% endif %}

              {% if looptijd is not none and looptijd < 10 %}

              > Een gemiddelde looptijd van {{ looptijd }} minuten is kort. Elke start kost
              rendement; langer en rustiger draaien levert een hogere COP op.

              {% endif %}

              {% else %}

              *Nog geen meting. Deze sensor telt vanaf nu; de compressorfrequentie moet een bron
              hebben — zie de kaart Databronnen.*

              {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Starts per uur tegen buitentemperatuur (48 uur) ──
      #
      # Dit is het plaatje waar de sensor voor bestaat. Veel starts terwijl de
      # buitentemperatuur laag is, betekent dat de stooklijn te hoog staat.
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Compressorstarts per uur & buitentemperatuur (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: starts
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "starts/uur"
              - id: temp
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 240
              stroke:
                curve: stepline
              legend:
                show: true
              grid:
                padding:
                  right: 55
            series:
              - entity: sensor.quatt_warmteanalyse_compressorstarts
                name: Starts per uur
                yaxis_id: starts
                color: "#E91E63"
                stroke_width: 2
                type: area
                opacity: 0.15
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buitentemperatuur
                yaxis_id: temp
                color: "#78909C"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Afwijking advies buiten + kamer (48 uur) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Afwijking advies buiten + kamer (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: error
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 200
              stroke:
                curve: smooth
              annotations:
                yaxis:
                  - "y": 2
                    borderColor: "#FF9800"
                    strokeDashArray: 4
                  - "y": -2
                    borderColor: "#FF9800"
                    strokeDashArray: 4
                  - "y": 0
                    borderColor: "#4CAF50"
                    strokeDashArray: 0
              legend:
                show: true
              grid:
                padding:
                  right: 100
            series:
              - entity: sensor.quatt_warmteanalyse_mpc_fout_aanvoertemperatuur
                name: Afwijking (advies − werkelijk)
                yaxis_id: error
                color: "#2196F3"
                stroke_width: 2
                type: area
                opacity: 0.1
            grid_options:
              columns: full
              rows: auto

      # ── Debiet & buitentemperatuur context (48 uur) ──
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              title: Debiet & buitentemperatuur (48 uur)
              show: true
            graph_span: 48h
            yaxis:
              - id: flow
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "l/h"
              - id: temp
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: "°C"
            apex_config:
              chart:
                height: 220
              stroke:
                curve: smooth
              legend:
                show: true
              grid:
                padding:
                  right: 55
            series:
              - entity: sensor.quatt_warmteanalyse_debiet
                name: Debiet
                yaxis_id: flow
                color: "#03A9F4"
                stroke_width: 2
                type: area
                opacity: 0.1
              - entity: sensor.quatt_warmteanalyse_buitentemperatuur
                name: Buitentemperatuur
                yaxis_id: temp
                color: "#78909C"
                stroke_width: 2
            grid_options:
              columns: full
              rows: auto

      # ── Soundslider & gasketel (alleen met soundslider-sturing) ──
      - type: grid
        column_span: 2
        visibility:
          - condition: state
            entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
            state_not:
              - unavailable
              - unknown
        cards:
          - type: history-graph
            title: Soundslider & gasketel (48 uur)
            hours_to_show: 48
            entities:
              - entity: sensor.quatt_warmteanalyse_geluidsniveau
                name: Soundslider
              - entity: binary_sensor.quatt_warmteanalyse_gasketel_actief
                name: Gasketel
              - entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
                name: Sturing
            grid_options:
              columns: full
              rows: auto

      # ── Soundslider-sturing (alleen zichtbaar als geconfigureerd) ──
      - type: grid
        visibility:
          - condition: state
            entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
            state_not:
              - unavailable
              - unknown
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: switch.quatt_warmteanalyse_geluidsniveau_compensatie
                state_not: unavailable
            card:
              type: markdown
              title: Soundslider-sturing
              content: >
                {% set sw =
                states('switch.quatt_warmteanalyse_geluidsniveau_compensatie') %}

                {% set level =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'current_level') %}

                {% set mpc_err =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'advies_fout') %}

                {% set bron =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'advies_bron') %}

                {% set hp =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'hp_active') %}

                {% set gas =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'gas_active') %}

                {% set boiler =
                state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie',
                'boiler_heat_w') %}

                {% set swe = 'switch.quatt_warmteanalyse_geluidsniveau_compensatie' %}

                {% set cic = state_attr(swe, 'cic_night') if state_attr(swe,
                'period') == 'nacht' else state_attr(swe, 'cic_day') %}

                {% set corr = state_attr(swe, 'corrections') | int(0) %}

                | | Status |

                |:--|:--|

                | Switch | {% if sw == 'on' %}Aan{% else %}Uit{% endif %} |

                | Stuurt op | {{ state_attr(swe, 'advies_bron_naam') or '—' }}{% if bron == '1r1c' and state_attr('sensor.quatt_warmteanalyse_1r1c_aanbevolen_aanvoertemperatuur', 'terugval') %} — leert nog, stuurt als buiten + kamer{% endif %} |

                | HP actief | {% if hp %}Ja{% else %}Nee{% endif %} |

                | Gas actief | {% if gas %}Ja ({{ boiler }} W){% else %}Nee{% endif %} |

                | Soundslider | **{{ level | default('—') }}** |

                | CiC ({{ state_attr(swe, 'period') | default('—', true) }}) | {{ cic | default('—', true) }}{% if cic and level and cic != level %} ⚠️{% endif %} |

                | Teruggezet | {{ corr }}×{% if corr %} — {{ state_attr(swe, 'last_correction') }}{% endif %} |

                | Advies − aanvoer | {% if mpc_err is not none %}{{ mpc_err }}°C{%
                else %}*n/a*{% endif %} |


                {% if sw == 'on' %}

                {% if not hp %}

                HP inactief — na 10 minuten zonder debiet gaat de soundslider terug naar '{{ state_attr('switch.quatt_warmteanalyse_geluidsniveau_compensatie', 'effective_max') | default('normal') }}'.

                {% elif gas %}

                Gas actief ({{ boiler }} W) — soundslider omhoog naar
                **{{ level }}**.

                {% elif mpc_err is not none and mpc_err < -2 %}

                Aanvoer te hoog (fout={{ mpc_err }}°C) — soundslider omlaag
                naar **{{ level }}**.

                {% elif mpc_err is not none and mpc_err > 2 %}

                Aanvoer te laag (fout={{ mpc_err }}°C) — soundslider omhoog tot het maximum, nu **{{ level }}**.

                {% else %}

                Aanvoer op schema — soundslider op **{{ level }}**.

                {% endif %}

                {% endif %}
            grid_options:
              columns: full
              rows: auto

      # ── Sturingseffect: wat de knoppen opleveren, per instelling ──
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            title: Sturingseffect
            content: |
              {%- set s = 'sensor.quatt_warmteanalyse_sturingseffect' -%}
              {%- set per = state_attr(s, 'per_instelling') or {} -%}
              {%- set v = state_attr(s, 'vandaag') -%}
              {%- set d = state_attr(s, 'drempels') or {} -%}
              {%- macro f(x, eenheid='') -%}{{ '—' if x is none else (x | string) ~ eenheid }}{%- endmacro -%}
              Wat de knoppen opleveren aan comfort, verbruik en slijtage — niet hoe goed een advies de CiC naspeelt.

              **Nu:** {{ states(s) }}

              {% if per -%}
              {%- set ns = namespace(t='| Instelling | Dagen | kWh stroom / graaddag | COP | Kamer − setpoint | Uren te koud / dag | Starts / stookuur | Gas | Tegen max. aanvoertemp. |\n|:--|--:|--:|--:|--:|--:|--:|--:|--:|\n') -%}
              {%- for naam, w in per.items() -%}
              {%- set ns.t = ns.t ~ '| ' ~ naam ~ ' | ' ~ w.dagen ~ ' | ' ~ f(w.kwh_stroom_per_graaddag) ~ ' | ' ~ f(w.cop) ~ ' | ' ~ f(w.kamer_afwijking_k, ' K') ~ ' | ' ~ f(w.uren_te_koud_per_dag) ~ ' | ' ~ f(w.starts_per_stookuur) ~ ' | ' ~ f(w.gas_aandeel_pct, '%') ~ ' | ' ~ f(w.tegen_max_aanvoer_pct, '%') ~ ' |\n' -%}
              {%- endfor -%}
              {{ ns.t }}
              {%- else -%}
              *Nog geen dag in het vergelijk. Een dag telt mee bij minstens 20 meeturen, {{ d.min_graaddagen | default(1) }} graaddag en één instelling voor minstens 80% van de tijd.*
              {%- endif %}

              {% if v -%}
              **Vandaag tot nu** ({{ v.instelling }}): kamer − setpoint {{ f(v.kamer_afwijking_k, ' K') }}, {{ v.uren_te_koud }} u te koud, {{ f(v.kwh_stroom, ' kWh') }} stroom, COP {{ f(v.cop) }}, {{ f(v.starts) }} starts in {{ v.stookuren }} stookuren{% if v.tegen_max_aanvoer_pct is not none %}, {{ v.tegen_max_aanvoer_pct }}% van de stooktijd tegen de max. aanvoertemperatuur{% endif %}.
              {%- endif %}

              *Graaddagen op het balanspunt van het huis ({{ d.graaddag_basis_c | default('—') }} °C). Te koud = meer dan {{ d.te_koud_k | default(0.3) }} K onder het setpoint; te warm = meer dan {{ d.te_warm_k | default(0.5) }} K erboven. Weer en gedrag verschillen per week: vergelijk instellingen over meerdere weken. Kijk eerst hoe vaak de aanvoer tegen de max. aanvoertemperatuur aanliep: gebeurt dat niet, dan begrenst die knop niets en komt een verschil er niet van. "Gepauzeerd (warmtevraag stuurt)": de warmtevraag stuurt OpenQuatt Power House rechtstreeks aan, en de max. aanvoertemperatuur schrijft dan niets.*
            grid_options:
              columns: full
              rows: auto
